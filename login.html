<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>管理者ログイン | Wi-Fi MEDIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #080c0f;
      --panel: rgba(9, 15, 19, .94);
      --edge: rgba(76, 229, 255, .32);
      --edge-soft: rgba(76, 229, 255, .14);
      --text: #edf3f5;
      --muted: #96a7ad;
      --green: #b7ff56;
      --cyan: #4ce5ff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "IBM Plex Sans JP", -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background-color: var(--screen);
      background-image:
        radial-gradient(ellipse at 46% 43%, rgba(16, 44, 49, .34), transparent 43%),
        radial-gradient(ellipse at 58% 56%, rgba(30, 52, 29, .10), transparent 49%),
        linear-gradient(rgba(76, 229, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(76, 229, 255, .035) 1px, transparent 1px);
      background-size: auto, auto, 34px 34px, 34px 34px;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(210, 246, 255, .012) 0 1px, transparent 1px 4px);
    }
    .login-stage { min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; }
    .login-panel {
      width: min(100%, 430px);
      position: relative;
      overflow: hidden;
      padding: 34px 36px 26px;
      border: 1px solid var(--edge);
      background: var(--panel);
      box-shadow: inset 0 0 0 1px rgba(183, 255, 86, .055), inset 1px 0 16px rgba(76, 229, 255, .035), 0 0 9px rgba(76, 229, 255, .12), 0 0 29px rgba(76, 229, 255, .07), -5px -5px 25px rgba(183, 255, 86, .035), 0 24px 80px rgba(0, 0, 0, .46);
    }
    .login-panel::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 2px;
      background: linear-gradient(180deg, var(--green), var(--cyan) 68%, transparent); opacity: .8;
    }
    .brand { margin: 0; color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-shadow: 0 0 8px rgba(76, 229, 255, .32); }
    h1 {
      margin: 20px 0 5px; color: transparent; background: linear-gradient(100deg, var(--green), var(--cyan) 76%);
      background-clip: text; -webkit-background-clip: text; font-family: Orbitron, "IBM Plex Sans JP", sans-serif;
      font-size: clamp(25px, 7vw, 32px); font-weight: 700; letter-spacing: .055em; line-height: 1.2;
      text-shadow: 0 0 5px rgba(76, 229, 255, .28), 0 0 12px rgba(76, 229, 255, .23), 0 0 25px rgba(76, 229, 255, .12), 0 0 29px rgba(183, 255, 86, .10);
    }
    .subtitle { margin: 0 0 23px; color: #c3d0d4; font-size: 13px; letter-spacing: .05em; }
    .auth-label {
      margin: 0 0 25px; padding: 10px 12px; border: 1px solid var(--edge-soft);
      border-left: 2px solid rgba(183, 255, 86, .68); color: #b8d9c2; background: rgba(4, 12, 15, .66);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .11em;
      text-shadow: 0 0 5px rgba(183, 255, 86, .12), 0 0 11px rgba(183, 255, 86, .07);
    }
    label { display: block; margin-bottom: 8px; color: #d6e1e4; font-size: 12px; font-weight: 600; }
    input[type="password"] {
      display: block; width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid #34434a;
      border-radius: 2px; outline: none; color: #f2f7f8; background: rgba(3, 8, 11, .88);
      font: inherit; letter-spacing: .08em; transition: border-color .15s ease, box-shadow .15s ease;
    }
    input[type="password"]:focus { border-color: rgba(76, 229, 255, .78); box-shadow: inset 0 0 10px rgba(76, 229, 255, .055), 0 0 0 1px rgba(76, 229, 255, .17), 0 0 12px rgba(76, 229, 255, .16), 0 0 22px rgba(76, 229, 255, .08); }
    .login-button {
      display: block; width: 100%; min-height: 45px; margin-top: 16px; border: 1px solid rgba(183, 255, 86, .6);
      border-radius: 2px; color: #071013; background: linear-gradient(100deg, #b7ff56, #4ce5ff);
      font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .16em; cursor: pointer;
      box-shadow: 0 0 8px rgba(76, 229, 255, .15), 0 0 16px rgba(183, 255, 86, .07);
      transition: box-shadow .15s ease;
    }
    .login-button:hover:not(:disabled) { box-shadow: 0 0 10px rgba(76, 229, 255, .24), 0 0 23px rgba(76, 229, 255, .16), 0 0 25px rgba(183, 255, 86, .10); }
    .login-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .login-button:disabled { cursor: wait; opacity: .72; }
    .login-error { margin: 13px 0 0; color: #ff9797; font-size: 12px; line-height: 1.6; }
    .login-error[hidden] { display: none; }
    .system-status {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 14px;
      border-top: 1px solid rgba(76, 229, 255, .15); color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; letter-spacing: .12em;
    }
    .secure-state { display: inline-flex; align-items: center; gap: 6px; color: var(--green); text-shadow: 0 0 5px rgba(183, 255, 86, .28), 0 0 11px rgba(183, 255, 86, .13); }
    .secure-state::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px rgba(183, 255, 86, .44), 0 0 9px rgba(183, 255, 86, .18); }
    @media (max-width: 480px) { .login-panel { padding: 29px 23px 22px; } .auth-label { font-size: 9px; letter-spacing: .075em; } }
  </style>
</head>
<body>
  <main class="login-stage">
    <section class="login-panel" aria-labelledby="login-title">
      <p class="brand">Wi-Fi MEDIA</p>
      <h1 id="login-title">ADMIN ACCESS</h1>
      <p class="subtitle">管理者ログイン</p>
      <p class="auth-label">&gt; AUTHENTICATION REQUIRED</p>
      <form id="login-form" autocomplete="off">
        <label for="admin-password">管理者パスワード</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="login-button" id="login-button" type="submit">LOGIN</button>
        <p class="login-error" id="login-error" role="alert" aria-live="polite" hidden></p>
      </form>
      <div class="system-status"><span>SYSTEM STATUS</span><span class="secure-state">SECURE</span></div>
    </section>
  </main>
  <script>
    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('admin-password');
    const loginButton = document.getElementById('login-button');
    const loginError = document.getElementById('login-error');
    let loginPending = false;

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (loginPending) return;
      loginPending = true;
      loginButton.disabled = true;
      loginButton.textContent = 'AUTHENTICATING...';
      loginError.hidden = true;
      loginError.textContent = '';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const result = await response.json().catch(() => null);
        if (response.ok && result && result.ok === true) {
          window.location.assign('/admin');
          return;
        }
        loginError.textContent = response.status === 401
          ? 'ACCESS DENIED — パスワードが正しくありません。'
          : '認証を完了できませんでした。時間をおいて再度お試しください。';
        loginError.hidden = false;
      } catch (_) {
        loginError.textContent = '認証サーバーに接続できません。';
        loginError.hidden = false;
      } finally {
        loginPending = false;
        loginButton.disabled = false;
        loginButton.textContent = 'LOGIN';
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
