<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi MEDIA</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e9e9;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif}.stage{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}.page{width:min(560px,100%);background:var(--bg);border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px #0002}.hero{height:var(--hero);position:relative;background:#d8d4c8 center/cover no-repeat;display:flex;align-items:flex-end;padding:25px}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0009)}.hero h1{position:relative;z-index:1;margin:0;color:white;font-size:clamp(25px,6vw,36px);line-height:1.2}.body{padding:26px}.brand{font-size:12px;font-weight:800;letter-spacing:.1em;margin-bottom:12px}.body p{font-size:15px;line-height:1.9;color:#666;white-space:pre-wrap}.cta{display:block;text-decoration:none;text-align:center;padding:15px 18px;border-radius:calc(var(--radius) * .65);font-weight:800;margin-top:22px}.note{text-align:center;font-size:11px;color:#888;margin-top:15px}@media(max-width:600px){.stage{padding:0}.page{min-height:100vh;border-radius:0;box-shadow:none}.hero{height:var(--hero-mobile)}.body{padding:22px}.body p{font-size:14px}}</style></head><body><div class="stage"><main class="page"><section class="hero" id="hero"><h1 id="title">読み込み中…</h1></section><section class="body"><div class="brand" id="brand"></div><p id="body"></p><a id="cta" class="cta" target="_blank" rel="noopener"></a><div class="note">Wi-Fi利用開始前のご案内</div></section></main></div><script>
async function postEvent(type, store, adId){try{await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,store,adId})})}catch(e){console.log('analytics event failed',e)}}
async function init(){const d=await fetch('/api/state').then(r=>r.json()),x=d.design,a=d.ad,r=document.documentElement;r.style.setProperty('--bg',x.background);r.style.setProperty('--text',x.textColor);r.style.setProperty('--radius',x.radius+'px');r.style.setProperty('--hero',x.heroHeight+'px');r.style.setProperty('--hero-mobile',Math.min(x.heroHeight,230)+'px');document.getElementById('title').textContent=x.pageTitle||a.title;document.getElementById('brand').textContent=x.brand;document.getElementById('body').textContent=a.body;document.getElementById('cta').textContent=x.buttonText;document.getElementById('cta').style.background=x.buttonColor;document.getElementById('cta').style.color=x.buttonTextColor;document.getElementById('brand').style.display=x.showBrand?'block':'none';document.getElementById('body').style.display=x.showBody?'block':'none';document.getElementById('cta').style.display=x.showButton?'block':'none';document.getElementById('cta').href=a.link||'#';if(a.media)document.getElementById('hero').style.backgroundImage=`url("${a.media}")`;else document.getElementById('hero').style.background='linear-gradient(135deg,#8c9884,#d8d0bf)';
postEvent('impression',a.store,a.id||'main');document.getElementById('cta').addEventListener('click',()=>postEvent('click',a.store,a.id||'main'))}init();</script></body></html>
