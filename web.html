<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi MEDIA</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e9e9;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif}.stage{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}.page{width:min(960px,100%);background:var(--bg);border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px #0002}.hero{height:var(--hero);position:relative;background:#d8d4c8 center/cover no-repeat;display:flex;align-items:flex-end;padding:25px}.page-title{margin:0 0 14px;color:var(--text);font-size:clamp(18px,4vw,24px);font-weight:700;line-height:1.45;overflow-wrap:anywhere}.body{padding:26px}.brand{font-size:12px;font-weight:800;letter-spacing:.1em;margin-bottom:12px}.body p{font-size:15px;line-height:1.9;color:#666;white-space:pre-wrap}.cta{display:block;text-decoration:none;text-align:center;padding:15px 18px;border-radius:calc(var(--radius) * .65);font-weight:800;margin-top:22px}.note{text-align:center;font-size:11px;color:#888;margin-top:15px}.wifi-guide{margin-top:10px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}.wifi-guide h2{margin:0 0 2px;font-size:13px;line-height:1.3;font-weight:700;color:var(--text)}.wifi-guide p{margin:0;font-size:12px;line-height:1.4;color:#666}.wifi-guide-label{display:inline-block;margin-top:2px;font-size:12px;line-height:1.4;color:#555;text-decoration:underline;text-underline-offset:2px}.coupons{margin-top:22px}.coupons h2{font-size:17px;margin:0 0 10px}.coupon-card{position:relative;border:1px dashed #aaa;border-radius:12px;padding:12px 14px;margin-top:10px;background:radial-gradient(circle at 0 50%,var(--bg) 0 7px,transparent 7.5px),radial-gradient(circle at 100% 50%,var(--bg) 0 7px,transparent 7.5px),#fff8}.coupon-card::before{content:"Wi-Fi USER COUPON";display:block;margin:0 0 4px;font-size:9px;line-height:1.2;letter-spacing:.12em;color:#888;font-weight:700}.coupon-title{font-size:15px;font-weight:800;margin:0 0 6px}.coupon-card>.coupon-title::after{content:"Wi-Fiご利用者限定";display:block;margin-top:3px;font-size:10px;line-height:1.3;font-weight:500;letter-spacing:.03em;color:#666}.coupon-show{position:relative;margin-top:26px}.coupon-show::before{content:"";position:absolute;top:-14px;left:0;right:0;border-top:1px dashed #aaa}.coupon-description,.coupon-terms,.coupon-period{font-size:12px;line-height:1.6;color:#666;margin:5px 0}.coupon-show{width:100%;border:0;border-radius:8px;padding:13px;background:#171717;color:#fff;font:inherit;font-weight:700;cursor:pointer}.coupon-overlay{position:fixed;inset:0;z-index:20;background:#111e;display:flex;align-items:center;justify-content:center;padding:20px}.coupon-presentation{width:min(480px,100%);background:#fff;border-radius:18px;padding:26px;text-align:center;box-shadow:0 20px 60px #0005}.coupon-presentation h2{font-size:24px;margin:0 0 14px}.coupon-presentation .coupon-title{font-size:20px}.coupon-presentation .coupon-description,.coupon-presentation .coupon-terms,.coupon-presentation .coupon-period{font-size:14px}.coupon-presentation .coupon-instruction{margin:22px 0 16px;font-weight:800;font-size:18px}.coupon-close{width:100%;border:0;border-radius:8px;padding:12px;background:#eee;color:#222;font:inherit;font-weight:700;cursor:pointer}@media(max-width:600px){.stage{padding:0}.page{min-height:100vh;border-radius:0;box-shadow:none}.hero{height:auto;aspect-ratio:4/5}.body{padding:16px 18px 18px}.page-title{font-size:clamp(16px,4vw,20px);margin-bottom:8px}.brand{margin-bottom:8px}.body p{font-size:14px;line-height:1.65;margin:8px 0}.cta{margin-top:14px;padding:14px 18px;min-height:48px}.note{margin-top:10px}.coupons{margin-top:14px}}.page.is-stopped #hero,.page.is-no-ad #hero{display:none}</style></head><body><div class="stage"><main class="page"><section class="hero" id="hero"></section><section class="body"><h1 id="title" class="page-title">読み込み中…</h1><div class="brand" id="brand"></div><p id="body"></p><a id="cta" class="cta" target="_blank" rel="noopener"></a><aside class="wifi-guide" aria-label="Wi-Fi利用案内"><h2>Wi-Fiをご利用になる前に</h2><p>Wi-Fiのご利用に関するご案内をご確認ください。</p><span class="wifi-guide-label">利用について詳しく見る</span></aside><section class="coupons" id="coupons" hidden aria-label="クーポン"></section></section></main></div><script>
let adHeroImageResizeHandler=null;
async function postEvent(type, store, adId, storeCode, campaignId){try{const event={type,store,adId};if(storeCode&&campaignId){event.storeCode=storeCode;event.campaignId=campaignId}await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)})}catch(e){console.log('analytics event failed',e)}}
function sendAdEvent(type, ad, storeValues){if(!storeValues.length)return postEvent(type,ad.store,ad.id||'main');if(storeValues.length!==1||!storeValues[0]||typeof ad.campaignId!=='string'||!ad.campaignId||typeof ad.id!=='string'||!ad.id)return;return postEvent(type,ad.store,ad.id,storeValues[0],ad.campaignId)}
async function postCouponEvent(coupon,type){if(new URLSearchParams(location.search).get('preview')==='1')return;try{const payload={couponId:coupon.id,type};const storeCode=new URLSearchParams(location.search).get('store');if(storeCode)payload.storeCode=storeCode;await fetch('/api/coupon_event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){console.log('coupon event failed',e)}}
function showCouponToStaff(coupon){const overlay=document.createElement('div');overlay.className='coupon-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','店員に見せるクーポン');const panel=document.createElement('section');panel.className='coupon-presentation';const heading=document.createElement('h2');heading.textContent='クーポン';panel.appendChild(heading);const title=document.createElement('div');title.className='coupon-title';title.textContent=coupon.title||'クーポン';panel.appendChild(title);if(coupon.description){const description=document.createElement('p');description.className='coupon-description';description.textContent=coupon.description;panel.appendChild(description)}if(coupon.terms){const terms=document.createElement('p');terms.className='coupon-terms';terms.textContent=coupon.terms;panel.appendChild(terms)}if(coupon.start||coupon.end){const period=document.createElement('p');period.className='coupon-period';period.textContent=`有効期間：${coupon.start||'開始日指定なし'}〜${coupon.end||'終了日指定なし'}`;panel.appendChild(period)}const instruction=document.createElement('p');instruction.className='coupon-instruction';instruction.textContent='この画面を店員にお見せください';panel.appendChild(instruction);const close=document.createElement('button');close.className='coupon-close';close.type='button';close.textContent='閉じる';close.addEventListener('click',()=>overlay.remove());panel.appendChild(close);overlay.addEventListener('click',event=>{if(event.target===overlay)overlay.remove()});overlay.appendChild(panel);document.body.appendChild(overlay);postCouponEvent(coupon,'redeem')}
async function loadCoupons(storeCode=null){const section=document.getElementById('coupons');try{const couponUrl=storeCode?`/api/coupons?store=${encodeURIComponent(storeCode)}`:'/api/coupons';const response=await fetch(couponUrl);if(!response.ok)return;const result=await response.json(),coupons=Array.isArray(result)?result:result.coupons;if(!Array.isArray(coupons)||!coupons.length)return;section.replaceChildren();const heading=document.createElement('h2');heading.textContent='クーポン';section.appendChild(heading);for(const coupon of coupons){const card=document.createElement('article');card.className='coupon-card';const title=document.createElement('h3');title.className='coupon-title';title.textContent=coupon.title||'クーポン';card.appendChild(title);if(coupon.description){const description=document.createElement('p');description.className='coupon-description';description.textContent=coupon.description;card.appendChild(description)}const show=document.createElement('button');show.className='coupon-show';show.type='button';show.textContent='店員に見せる';show.addEventListener('click',()=>showCouponToStaff(coupon));card.appendChild(show);if(coupon.terms){const terms=document.createElement('p');terms.className='coupon-terms';terms.textContent=coupon.terms;card.appendChild(terms)}if(coupon.start||coupon.end){const period=document.createElement('p');period.className='coupon-period';period.textContent=`有効期間：${coupon.start||'開始日指定なし'}〜${coupon.end||'終了日指定なし'}`;card.appendChild(period)}section.appendChild(card)}section.hidden=false;if(new URLSearchParams(location.search).get('preview')!=='1'){for(const coupon of coupons)postCouponEvent(coupon,'view')}}catch(e){console.log('coupon load failed',e)}}
function clearAdPresentation(titleText, bodyText, hideBrand=true){
 if(adHeroImageResizeHandler){window.removeEventListener('resize',adHeroImageResizeHandler);window.removeEventListener('orientationchange',adHeroImageResizeHandler);adHeroImageResizeHandler=null}
 const title=document.getElementById('title');
 const brand=document.getElementById('brand');
 const body=document.getElementById('body');
 const cta=document.getElementById('cta');
 cta.onclick=null;
 cta.removeAttribute('href');
 cta.removeAttribute('data-ad-id');
 cta.textContent='';
 cta.style.display='none';
 cta.style.background='';
 cta.style.color='';
 title.textContent=titleText||'';
 if(hideBrand){brand.textContent='';brand.style.display='none'}
 body.textContent=bodyText||'';
 body.style.display=bodyText?'block':'none';
 document.getElementById('hero').style.background='linear-gradient(135deg,#8c9884,#d8d0bf)';
}
function setResponsiveAdImage(ad){
 const hero=document.getElementById('hero');
 const pcImage=typeof ad.media==='string'?ad.media:'';
 const mobileImage=typeof ad.mediaMobile==='string'?ad.mediaMobile:'';
 adHeroImageResizeHandler=()=>{
  const isMobile=window.matchMedia?window.matchMedia('(max-width: 600px)').matches:window.innerWidth<=600;
  const image=isMobile&&mobileImage?mobileImage:pcImage;
  if(image){hero.style.backgroundImage=`url("${image}")`;hero.style.backgroundSize='cover';hero.style.backgroundPosition='center';hero.style.backgroundRepeat='no-repeat'}
  else hero.style.background='linear-gradient(135deg,#8c9884,#d8d0bf)';
 };
 window.addEventListener('resize',adHeroImageResizeHandler,{passive:true});
 window.addEventListener('orientationchange',adHeroImageResizeHandler,{passive:true});
 adHeroImageResizeHandler();
}
function showPublicMessage(titleText, bodyText){clearAdPresentation(titleText,bodyText,true)}
async function init(){
 clearAdPresentation('読み込み中…','',true);
 const params=new URLSearchParams(location.search);
 const storeValues=params.getAll('store');
 const preview=params.get('preview')==='1';
 if(!storeValues.length)loadCoupons();
 const configUrl=storeValues.length
  ? '/api/public-config?'+storeValues.map(value=>'store='+encodeURIComponent(value)).join('&')
  : '/api/public-config';
 let response;
 try{response=await fetch(configUrl)}catch(e){showPublicMessage('読み込みエラー','ページを読み込めませんでした。');return}
 if(response.status===404){showPublicMessage('店舗が見つかりません','指定された店舗のページはありません。');return}
 if(!response.ok){showPublicMessage('読み込みエラー','ページを読み込めませんでした。');return}
 let d;
 try{d=await response.json()}catch(e){showPublicMessage('読み込みエラー','ページを読み込めませんでした。');return}
 const x=d&&d.design,a=d&&d.ad;
 if(!x||typeof x!=='object'){showPublicMessage('読み込みエラー','ページを読み込めませんでした。');return}
 const r=document.documentElement;
 r.style.setProperty('--bg',x.background);r.style.setProperty('--text',x.textColor);r.style.setProperty('--radius',x.radius+'px');r.style.setProperty('--hero',x.heroHeight+'px');r.style.setProperty('--hero-mobile',Math.min(x.heroHeight,230)+'px');
 document.getElementById('brand').textContent=x.brand;
 document.getElementById('brand').style.display=x.showBrand?'block':'none';
 const publicPage=document.querySelector('.page');
 if(storeValues.length===1&&d.storeStatus==='停止中'){
  publicPage.classList.add('is-stopped');
  showPublicMessage('この店舗のWi-Fi MEDIAは現在一時停止中','広告・クーポンは現在ご利用いただけません。');
  return;
 }
 publicPage.classList.remove('is-stopped');
 if(storeValues.length===1)await loadCoupons(storeValues[0]);
 if(!a||typeof a!=='object'||typeof a.title!=='string'||!a.title.trim()){
  publicPage.classList.add('is-no-ad');
  clearAdPresentation(x.pageTitle||'現在、広告はありません','この店舗で配信中の広告はありません。',false);
  return;
 }
 publicPage.classList.remove('is-no-ad');
 document.getElementById('title').textContent=x.pageTitle||a.title;
 document.getElementById('body').textContent=a.body;
 document.getElementById('cta').textContent=x.buttonText;
 document.getElementById('cta').style.background=x.buttonColor;
 document.getElementById('cta').style.color=x.buttonTextColor;
 document.getElementById('body').style.display=x.showBody?'block':'none';
 document.getElementById('cta').style.display=x.showButton?'block':'none';
 document.getElementById('cta').href=a.link||'#';
 document.getElementById('cta').setAttribute('data-ad-id',String(a.id||''));
 setResponsiveAdImage(a);
 const cta=document.getElementById('cta');
 if(!preview)sendAdEvent('impression',a,storeValues);
 cta.onclick=async event=>{event.preventDefault();const destination=cta.href;const popup=window.open('about:blank','_blank');if(!preview)await sendAdEvent('click',a,storeValues);if(popup)popup.location.href=destination;else window.location.href=destination};
}
init();</script></body></html>
