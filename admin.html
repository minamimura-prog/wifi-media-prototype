<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi MEDIA 管理画面</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font-family:"IBM Plex Sans JP",-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#15171a;color:#fff;padding:22px 14px;flex:none}.logo{font-weight:800;font-size:18px;padding:8px}.logo small{display:block;color:#9da1a7;font-weight:400;font-size:10px;margin-top:4px}.nav{padding:11px 12px;margin:4px 0;border-radius:8px;color:#c9ccd1;cursor:pointer}.nav:hover,.nav.active{background:#2a2d31;color:#fff}.main{width:100%;max-width:1400px;padding:28px 34px}.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:20px}h1{font-size:26px;margin:0 0 5px}.sub{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:white;border:1px solid #e1e3e6;border-radius:14px;padding:18px}.label{font-size:12px;color:#777}.metric{font-size:28px;font-weight:800;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 420px;gap:18px}.section{font-size:16px;font-weight:800;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 7px;border-bottom:1px solid #eee;font-size:13px}th{font-size:11px;color:#777}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf7ee;font-size:11px}.off{background:#eee;color:#777}button{border:0;border-radius:8px;padding:10px 13px;background:#151515;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eceef1;color:#222}.actions{display:flex;gap:8px;flex-wrap:wrap}.phonewrap{background:#eef0f3;padding:18px;border-radius:12px}.phone{max-width:285px;margin:auto;border:8px solid #111;border-radius:28px;overflow:hidden;background:#fff}.phone iframe{display:block;width:100%;height:540px;border:0}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;padding:10px;border:1px solid #d6d9de;border-radius:8px;font:inherit;background:white}textarea{min-height:85px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalbg{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modal h2{margin-top:0}.close{float:right;background:#eee;color:#222}.previewbox{margin-top:12px;border:1px dashed #bbb;border-radius:10px;padding:10px;color:#777;font-size:12px}.pie{width:190px;height:190px;border-radius:50%;margin:8px auto;background:conic-gradient(#222 0 38%,#777 38% 67%,#bbb 67% 86%,#ddd 86% 100%);position:relative}.pie:after{content:"";position:absolute;inset:47px;background:#fff;border-radius:50%}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;color:#666}@media(max-width:1050px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.main{padding:18px 14px}.grid{grid-template-columns:1fr 1fr}.pagehead{align-items:flex-start;flex-direction:column}.twocol{grid-template-columns:1fr}.phone{max-width:320px}.phone iframe{height:560px}}
/* Wi-Fi MEDIA night-operations theme */
:root {
  --night-bg: #111214;
  --night-panel: #24272c;
  --night-raised: #2b2f36;
  --night-edge: #3b414a;
  --night-edge-soft: #32373e;
  --night-text: #f1f3f6;
  --night-muted: #a6adb7;
  --neon-green: #b7ff56;
  --signal-cyan: #4ce5ff;
  --signal-magenta: #ff64d9;
}
body {
  background-color: var(--night-bg);
  background-image:
    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--night-text);
}
.side {
  background: #191b20;
  border-right: 1px solid var(--night-edge);
  box-shadow: 4px 0 20px #0003;
}
.logo small, .nav { color: var(--night-muted); }
.nav { border-radius: 6px; transition: background .18s, color .18s, box-shadow .18s; }
.nav:hover, .nav.active {
  color: var(--night-text);
  background: #252a31;
  box-shadow: inset 2px 0 0 var(--signal-cyan), 0 0 10px #4ce5ff12;
}
.main { color: var(--night-text); }
.pagehead { border-bottom: 1px solid var(--night-edge-soft); }
.sub, .label, th, .legend, .previewbox { color: var(--night-muted); }
.card {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  box-shadow: 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}
.grid > .card {
  background: var(--night-raised);
  border-color: #414751;
}
.section { color: var(--night-text); border-bottom: 1px solid var(--night-edge-soft); }
.metric { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
.metric.connection, .metric.impression, .metric.coupon-view { color: var(--neon-green); text-shadow: 0 0 12px #b7ff5628; }
.metric.click, .metric.coupon-copy { color: var(--signal-cyan); text-shadow: 0 0 12px #4ce5ff28; }
.metric.ctr, .metric.coupon-redeem { color: var(--signal-magenta); text-shadow: 0 0 12px #ff64d928; }
.metric.store, .metric.record, .metric.coupon-total { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
table { color: var(--night-text); }
th { color: #dce2e9; background: #1c1f24; border-bottom-color: var(--night-edge); }
td { color: #e5e8ed; border-bottom-color: var(--night-edge-soft); }
tbody tr:hover td { background: #30353d; }
.badge {
  color: #d6ff9d;
  background: #263621;
  border: 1px solid #52703a;
  border-radius: 5px;
  box-shadow: 0 0 8px #b7ff5610;
}
.off {
  color: #ffabe9;
  background: #392637;
  border-color: #70466b;
  box-shadow: 0 0 8px #ff64d910;
}
button {
  color: #eff5f7;
  background: #30353d;
  border: 1px solid #505862;
  border-radius: 6px;
  box-shadow: 0 2px 7px #0004;
  transition: border-color .16s, background .16s, box-shadow .16s, transform .16s;
}
button:hover {
  color: var(--night-text);
  background: #343d43;
  border-color: var(--signal-cyan);
  box-shadow: 0 0 9px #4ce5ff22;
}
button:active { transform: translateY(1px); }
button.secondary {
  color: #e0e5eb;
  background: #282c32;
  border-color: #424851;
  box-shadow: none;
}
button.secondary:hover { border-color: var(--neon-green); box-shadow: 0 0 8px #b7ff5618; }
input, textarea, select {
  color: var(--night-text);
  background: #1b1e23;
  border-color: #444a54;
  border-radius: 6px;
  color-scheme: dark;
}
input::placeholder, textarea::placeholder { color: #7f8791; }
input:focus, textarea:focus, select:focus {
  outline: 1px solid var(--signal-cyan);
  border-color: var(--signal-cyan);
  box-shadow: 0 0 8px #4ce5ff20;
}
.modalbg { background: #050608c9; backdrop-filter: blur(3px); }
.modal {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid #4a515b;
  border-radius: 10px;
  box-shadow: 0 12px 40px #0009, 0 0 18px #4ce5ff12;
}
.modal h2 { color: var(--night-text); }
.close { color: var(--night-text); background: #30353d; }
.close:hover { border-color: var(--signal-magenta); box-shadow: 0 0 8px #ff64d91c; }
.previewbox { color: var(--night-muted); background: #1d2025; border-color: #444a54; }
.phonewrap { background: #1b1e23; border: 1px solid var(--night-edge); border-radius: 8px; }
.phone { background: #0b0c0e; border-color: #070809; border-radius: 12px; }
.pie {
  background: conic-gradient(
    var(--neon-green) 0 var(--view-end),
    var(--signal-cyan) var(--view-end) var(--copy-end),
    var(--signal-magenta) var(--copy-end) 100%
  );
  box-shadow: 0 0 12px #4ce5ff12;
}
.pie:after { background: var(--night-panel); }
.pie.is-empty { background: conic-gradient(#414751 0 100%); box-shadow: none; }
.pie-total {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  color: var(--night-text);
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.coupon-chart {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  align-items: center;
  gap: 20px;
  max-width: 500px;
  margin: 8px auto 22px;
  padding: 8px 14px;
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  background: #202329;
}
.coupon-legend { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.coupon-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 9px; color: var(--night-muted); font-size: 13px; }
.coupon-legend strong { color: var(--night-text); font-size: 14px; font-variant-numeric: tabular-nums; }
.coupon-swatch { width: 9px; height: 9px; border-radius: 2px; }
.coupon-swatch-view { background: var(--neon-green); box-shadow: 0 0 6px #b7ff5630; }
.coupon-swatch-copy { background: var(--signal-cyan); box-shadow: 0 0 6px #4ce5ff30; }
.coupon-swatch-redeem { background: var(--signal-magenta); box-shadow: 0 0 6px #ff64d930; }
.legend { color: var(--night-muted); }
.card i[title^="表示"] {
  background-color: var(--neon-green) !important;
  box-shadow: 0 0 8px #b7ff5630;
}
.card i[title^="クリック"] {
  background-color: var(--signal-cyan) !important;
  box-shadow: 0 0 8px #4ce5ff30;
}
@media (max-width: 700px) {
  .side { border-right: 0; border-bottom: 1px solid var(--night-edge); box-shadow: 0 4px 16px #0003; }
  .coupon-chart { grid-template-columns: 1fr; justify-items: center; gap: 8px; padding: 14px; }
  .coupon-legend { width: min(100%, 280px); }
}

/* STEP A-2: subtle neon panel edges */
.card, .modal, .phonewrap {
  border-color: #3a4650;
  box-shadow:
    0 0 0 1px rgba(76, 229, 255, .045),
    0 6px 20px rgba(0, 0, 0, .28),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.grid > .card {
  border-color: #46504e;
  box-shadow:
    0 0 0 1px rgba(183, 255, 86, .035),
    0 6px 18px rgba(0, 0, 0, .3),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.previewbox {
  border-color: #3d4951;
  box-shadow: 0 0 10px rgba(76, 229, 255, .035);
}

/* STEP A-3: terminal identity labels */
.pagehead {
  position: relative;
  padding-top: 18px;
}
.pagehead::before {
  position: absolute;
  top: 0;
  left: 0;
  content: "SYSTEM STATUS";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  line-height: 1;
  text-shadow: 0 0 6px rgba(76, 229, 255, .3);
}
.logo small {
  font-size: 0;
  line-height: 1.5;
  letter-spacing: .16em;
}
.logo small::before {
  content: "CONTROL SYSTEM";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  text-shadow: 0 0 6px rgba(76, 229, 255, .24);
}

/* STEP A-4: terminal status badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #d6ff9d;
  background: #263621;
  border-color: #52703a;
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(183, 255, 86, .08);
  letter-spacing: .04em;
}
.badge::before {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  content: "";
  background: var(--neon-green);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(183, 255, 86, .55);
}
.badge.off {
  color: #a4abb4;
  background: #22262b;
  border-color: #41474f;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}
.badge.off::before {
  background: #727a84;
  box-shadow: none;
}

/* STEP B-1: terminal bar chart */
.card div[style*="min-height:170px"] {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    rgba(166, 186, 198, .09) 31px,
    rgba(166, 186, 198, .09) 32px
  );
  background-size: 100% 32px;
  border-bottom: 1px solid rgba(166, 186, 198, .16);
}
.card i[title^="表示"] {
  background-color: #88e943 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(15, 30, 8, .18) 5px 6px),
    linear-gradient(0deg, #538a2e 0%, #b7ff56 100%) !important;
  border: 1px solid rgba(211, 255, 163, .52);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(183, 255, 86, .2);
}
.card i[title^="クリック"] {
  background-color: #39cce5 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(4, 20, 28, .18) 5px 6px),
    linear-gradient(0deg, #246b80 0%, #4ce5ff 100%) !important;
  border: 1px solid rgba(157, 243, 255, .5);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(76, 229, 255, .2);
}
</style></head><body><div class="app"><aside class="side"><div class="logo">Wi-Fi MEDIA<small>広告・店舗・効果測定</small></div><div class="nav active" onclick="dashboard()">ダッシュボード</div><div class="nav" onclick="ads()">広告管理</div><div class="nav" onclick="stores()">店舗管理</div><div class="nav" onclick="reports()">効果測定</div><div class="nav" onclick="couponManager()">クーポン管理</div><div class="nav" onclick="design()">Webデザイン</div></aside><main class="main" id="main"></main></div><div class="modalbg" id="modal"><div class="modal"><button class="close" onclick="closeModal()">閉じる</button><h2 id="modalTitle">編集</h2><div id="modalBody"></div></div></div><script>let S=null;async function load(){S=await fetch('/api/state').then(r=>r.json());dashboard()}async function save(){await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});await load();toast('保存しました')}function shell(t,s,c){document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>${t}</h1><div class="sub">${s}</div></div></div>${c}`}async function dashboard(){const a=await fetch('/api/analytics').then(r=>r.json());shell('ダッシュボード','Wi-Fi接続・広告配信・店舗状況をまとめて確認できます.',`<div class="grid"><div class="card"><div class="label">登録店舗</div><div class="metric store">${S.stores.length}</div></div><div class="card"><div class="label">今月の接続</div><div class="metric connection">${a.impressions.toLocaleString()}</div></div><div class="card"><div class="label">広告クリック</div><div class="metric click">${a.clicks.toLocaleString()}</div></div><div class="card"><div class="label">CTR</div><div class="metric ctr">${a.ctr}%</div></div></div><div class="layout"><section class="card"><div class="section">店舗別 配信状況</div><table><thead><tr><th>店舗</th><th>広告</th><th>接続</th><th>状態</th><th></th></tr></thead><tbody>${S.stores.map((x,i)=>`<tr><td><b>${x.name}</b><br><small>${x.type}</small></td><td>${S.ad.title}</td><td>${x.users.toLocaleString()}</td><td><span class="badge ${x.status==='停止中'?'off':''}">${x.status}</span></td><td><button class="secondary" onclick="editStore(${i})">編集</button></td></tr>`).join('')}</tbody></table></section><section class="card"><div class="section">Webページ プレビュー</div><div class="phonewrap"><div class="phone"><iframe src="/?preview=1" title="preview"></iframe></div></div></section></div>`)}function ads(){shell('広告管理','広告内容・掲載期間・リンク・画像/GIFを管理します.',`<div class="layout"><section class="card"><div class="section">現在の広告</div><div class="field"><label>店舗</label><select id="aStore">${S.stores.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>タイトル</label><input id="aTitle" value="${esc(S.ad.title)}"></div><div class="field"><label>本文</label><textarea id="aBody">${esc(S.ad.body)}</textarea></div><div class="twocol"><div class="field"><label>掲載開始</label><input id="aStart" type="date" value="${S.ad.start}"></div><div class="field"><label>掲載終了</label><input id="aEnd" type="date" value="${S.ad.end}"></div></div><div class="field"><label>「詳しく見る」のリンク先</label><input id="aLink" type="url" value="${esc(S.ad.link)}" placeholder="https://..."></div><div class="field"><label>画像 / GIF</label><input id="aFile" type="file" accept=".gif,image/gif,image/png,image/jpeg,image/webp"><div class="previewbox">GIFを選ぶとサーバーへアップロードし、公開ページのメインビジュアルとして表示できます。</div></div><div class="actions"><button onclick="publishAd()">保存して公開</button><button class="secondary" onclick="window.open('/','_blank')">公開ページを開く</button></div></section><section class="card"><div class="section">広告プレビュー</div><div class="phonewrap"><div class="phone"><iframe src="/?preview=1" title="preview"></iframe></div></div></section></div>`)}async function publishAd(){const f=document.getElementById('aFile').files[0];let media=S.ad.media;if(f){const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json();if(j.error){alert(j.error);return}media=j.url}S.ad={...S.ad,store:document.getElementById('aStore').value,title:document.getElementById('aTitle').value,body:document.getElementById('aBody').value,start:document.getElementById('aStart').value,end:document.getElementById('aEnd').value,link:document.getElementById('aLink').value,media,published:true};await save()}function couponManager(){S.coupons=S.coupons||[];shell('クーポン管理','クーポンを登録して一覧を確認できます。',`<div class="layout"><section class="card"><div class="section">クーポンを登録</div><div class="field"><label>クーポン名</label><input id="cTitle" placeholder="例：ドリンク1杯無料"></div><div class="field"><label>クーポンコード</label><input id="cCode" placeholder="例：WELCOME10"></div><div class="field"><label>説明</label><textarea id="cDescription" placeholder="特典の内容"></textarea></div><div class="twocol"><div class="field"><label>割引種別</label><select id="cDiscountType"><option value="text">特典内容</option><option value="percent">割引率</option><option value="amount">割引額</option></select></div><div class="field"><label>割引値 / 特典表記</label><input id="cDiscountValue" placeholder="例：10 または ドリンク1杯"></div></div><div class="field"><label>利用店舗</label><select id="cStore"><option value="">指定なし</option>${S.stores.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div><div class="twocol"><div class="field"><label>開始日</label><input id="cStart" type="date"></div><div class="field"><label>終了日</label><input id="cEnd" type="date"></div></div><div class="field"><label>利用条件</label><textarea id="cTerms" placeholder="例：1会計につき1回"></textarea></div><div class="field"><label>状態</label><select id="cStatus"><option value="draft">下書き</option><option value="active">公開中</option></select></div><button onclick="addCoupon()">クーポンを登録</button></section><section class="card"><div class="section">登録済みクーポン</div>${S.coupons.length?`<table><thead><tr><th>クーポン</th><th>コード</th><th>特典内容</th><th>店舗</th><th>期間</th><th>状態</th><th>操作</th></tr></thead><tbody>${S.coupons.map(c=>{const store=S.stores.find(x=>String(x.id)===String(c.storeId))||S.stores.find(x=>x.name===c.store);return `<tr><td><b>${esc(c.title||'クーポン')}</b>${c.description?`<br><small>${esc(c.description)}</small>`:''}</td><td>${esc(c.code||'')}</td><td>${esc(c.discountValue||c.description||'')}</td><td>${esc(store?.name||'指定なし')}</td><td>${esc(c.start||'—')} 〜 ${esc(c.end||'—')}</td><td><span class="badge ${c.status==='active'?'':'off'}">${c.status==='active'?'公開中':'下書き'}</span></td><td>${c.status==='draft'?`<button class="secondary" onclick="deleteCoupon('${esc(c.id)}')">削除</button>`:'公開中のため削除不可'}</td></tr>`}).join('')}</tbody></table>`:'<p class="sub">クーポンはまだ登録されていません。</p>'}</section></div>`)}async function deleteCoupon(id){const coupon=S.coupons.find(c=>String(c.id)===String(id));if(!coupon||coupon.status!=='draft')return;if(!confirm(`下書きクーポン「${coupon.title||'クーポン'}」を削除しますか？\n利用履歴は保持されます。`))return;const r=await fetch(`/api/coupons/${encodeURIComponent(id)}`,{method:'DELETE'});const result=await r.json();if(!r.ok){alert(result.error||'削除できませんでした。');return}S=await fetch('/api/state').then(r=>r.json());couponManager();toast('下書きクーポンを削除しました')}
async function addCoupon(){const title=document.getElementById('cTitle').value.trim(),code=document.getElementById('cCode').value.trim();if(!title||!code){alert('クーポン名とクーポンコードを入力してください。');return}S.coupons=S.coupons||[];const storeId=document.getElementById('cStore').value;S.coupons.push({id:Date.now().toString(),adId:S.ad.id||'main',storeId:storeId||null,title,code,description:document.getElementById('cDescription').value.trim(),discountType:document.getElementById('cDiscountType').value,discountValue:document.getElementById('cDiscountValue').value.trim(),terms:document.getElementById('cTerms').value.trim(),start:document.getElementById('cStart').value,end:document.getElementById('cEnd').value,status:document.getElementById('cStatus').value});await save();couponManager()}function stores(){shell('店舗管理','Wi-Fiを設置している店舗・ホテル・拠点を管理します.',`<div class="card"><div class="actions" style="justify-content:flex-end;margin-bottom:12px"><button onclick="addStore()">＋ 店舗を追加</button></div><table><thead><tr><th>店舗</th><th>業態</th><th>Wi-Fi</th><th>月間接続</th><th>状態</th><th></th></tr></thead><tbody>${S.stores.map((x,i)=>`<tr><td><b>${x.name}</b></td><td>${x.type}</td><td>${x.wifi}</td><td>${x.users.toLocaleString()}</td><td>${x.status}</td><td><button class="secondary" onclick="editStore(${i})">編集</button> <button class="secondary" onclick="deleteStore(${i})">削除</button></td></tr>`).join('')}</tbody></table></div>`)}async function deleteStore(i){if(!confirm(`「${S.stores[i].name}」を削除しますか？`))return;S.stores.splice(i,1);await save();stores()} function editStore(i){const x=S.stores[i];openModal('店舗を編集',`<div class="field"><label>店舗名</label><input id="sName" value="${esc(x.name)}"></div><div class="field"><label>業態</label><input id="sType" value="${esc(x.type)}"></div><div class="field"><label>Wi-Fi</label><input id="sWifi" value="${esc(x.wifi)}"></div><div class="field"><label>月間接続数</label><input id="sUsers" type="number" value="${x.users}"></div><div class="field"><label>状態</label><select id="sStatus"><option ${x.status==='稼働中'?'selected':''}>稼働中</option><option ${x.status==='停止中'?'selected':''}>停止中</option></select></div><button onclick="saveStore(${i})">保存</button>`)}function addStore(){S.stores.push({id:Date.now().toString(),name:'新規店舗',type:'店舗',wifi:'Guest Wi-Fi',users:0,clicks:0,status:'稼働中'});stores();save()}function saveStore(i){const x=S.stores[i];x.name=document.getElementById('sName').value;x.type=document.getElementById('sType').value;x.wifi=document.getElementById('sWifi').value;x.users=+document.getElementById('sUsers').value;x.status=document.getElementById('sStatus').value;closeModal();save()}async function reports(){
  const a=await fetch('/api/analytics').then(r=>r.json());
  const couponAnalytics=await fetch('/api/coupon_analytics').then(r=>r.ok?r.json():Promise.reject(new Error('coupon analytics unavailable'))).catch(()=>({total:0,byType:{},byCoupon:[],unavailable:true}));
  const couponEventCounts={view:Math.max(0,Number(couponAnalytics.byType?.view)||0),copy:Math.max(0,Number(couponAnalytics.byType?.copy)||0),redeem:Math.max(0,Number(couponAnalytics.byType?.redeem)||0)};
  const couponEventTotal=couponEventCounts.view+couponEventCounts.copy+couponEventCounts.redeem;
  const couponViewEnd=couponEventTotal?couponEventCounts.view/couponEventTotal*100:0;
  const couponCopyEnd=couponEventTotal?(couponEventCounts.view+couponEventCounts.copy)/couponEventTotal*100:0;
  const monthly=a.monthly||[];
  const maxMonthly=Math.max(1,...monthly.map(x=>x.impressions||0));

  const storeRows=Object.entries(a.byStore||{});
  const adRows=a.byAd||[];

  shell('効果測定','PostgreSQLに記録された実測値です。月の区切りは日本時間です.',
  `<div class="grid">
    <div class="card"><div class="label">累計表示回数</div><div class="metric impression">${a.impressions.toLocaleString()}</div></div>
    <div class="card"><div class="label">累計クリック</div><div class="metric click">${a.clicks.toLocaleString()}</div></div>
    <div class="card"><div class="label">実測CTR</div><div class="metric ctr">${a.ctr}%</div></div>
    <div class="card"><div class="label">記録件数</div><div class="metric record">${(a.impressions+a.clicks).toLocaleString()}</div></div>
  </div>

  <section class="card" style="margin-bottom:18px">
    <div class="section">月別推移（実測・日本時間）</div>
    ${monthly.length?`
      <div style="display:flex;align-items:flex-end;gap:12px;min-height:170px;padding:12px 4px 0;overflow-x:auto">
        ${monthly.map(x=>`
          <div style="min-width:76px;text-align:center;font-size:11px">
            <div style="height:125px;display:flex;align-items:flex-end;justify-content:center;gap:5px">
              <i title="表示 ${x.impressions}" style="display:block;width:22px;height:${Math.max(3,(x.impressions||0)/maxMonthly*115)}px;background:#222;border-radius:4px 4px 0 0"></i>
              <i title="クリック ${x.clicks}" style="display:block;width:22px;height:${Math.max(3,(x.clicks||0)/maxMonthly*115)}px;background:#8a9bb0;border-radius:4px 4px 0 0"></i>
            </div>
            <b>${x.month}</b>
            <div>CTR ${x.ctr}%</div>
          </div>`).join('')}
      </div>
      <div style="font-size:12px;color:#777">■ 表示　■ クリック</div>`
      :'<p style="color:#777">まだ月別の実測データがありません。</p>'}

    <table style="margin-top:16px">
      <thead><tr><th>月（日本時間）</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
      <tbody>
        ${monthly.length?monthly.slice().reverse().map(x=>`
          <tr><td>${x.month}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>
        `).join(''):'<tr><td colspan="4">まだ月別の実測データがありません。</td></tr>'}

    </table>
  </section>

  <div class="layout">
    <section class="card">
      <div class="section">店舗別比較（実測）</div>
      <table>
        <thead><tr><th>店舗</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
        <tbody>
          ${storeRows.length?storeRows.map(([k,x])=>`
            <tr><td>${k}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>
          `).join(''):'<tr><td colspan="4">まだ店舗別データがありません。</td></tr>'}
        </tbody>
      </table>
    </section>

    <section class="card">
      <div class="section">広告別比較（実測）</div>
      <table>
        <thead><tr><th>広告</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
        <tbody>
          ${adRows.length?adRows.map(x=>`
            <tr><td>${x.name||x.id}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>
          `).join(''):'<tr><td colspan="4">まだ広告別データがありません。</td></tr>'}
        </tbody>
      </table>
    </section>
  </div>

  <section class="card" style="margin-top:18px">
    <div class="section">日別の実測データ</div>
    <table>
      <thead><tr><th>日付</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
      <tbody>
        ${a.daily.length?a.daily.slice().reverse().map(x=>`
          <tr><td>${x.date}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>
        `).join(''):'<tr><td colspan="4">まだ実測データがありません。公開ページを開くと表示回数が記録されます。</td></tr>'}
      </tbody>
    </table>
    <p style="font-size:12px;color:#777;line-height:1.7;margin-top:14px">※この試作では、個人を特定する情報は保存せず、「表示」「クリック」「店舗」「広告」「日時」だけを記録しています。</p>
  </section>

  <section class="card" style="margin-top:18px">
    <div class="section">クーポン効果測定</div>
    ${couponAnalytics.unavailable?'<p style="color:#777">クーポン集計を読み込めませんでした。時間をおいて再度ご確認ください。</p>':`
      <div class="grid">
        <div class="card"><div class="label">クーポン関連イベント</div><div class="metric coupon-total">${(couponAnalytics.total||0).toLocaleString()}</div></div>
        <div class="card"><div class="label">表示</div><div class="metric coupon-view">${(couponAnalytics.byType?.view||0).toLocaleString()}</div></div>
        <div class="card"><div class="label">店員に見せる</div><div class="metric coupon-copy">${(couponAnalytics.byType?.copy||0).toLocaleString()}</div></div>
        <div class="card"><div class="label">利用</div><div class="metric coupon-redeem">${(couponAnalytics.byType?.redeem||0).toLocaleString()}</div></div>
      </div>
      <div class="coupon-chart">
        <div class="pie${couponEventTotal?'':' is-empty'}" role="img" aria-label="クーポンイベント構成。表示 ${couponEventCounts.view} 件、店員に見せる ${couponEventCounts.copy} 件、利用 ${couponEventCounts.redeem} 件" style="--view-end:${couponViewEnd}%;--copy-end:${couponCopyEnd}%"><span class="pie-total">${couponEventTotal.toLocaleString()}</span></div>

      <table>

        <tbody>

            <tr><td>${esc(x.couponCode||'（コードなし）')}</td><td>${(x.total||0).toLocaleString()}</td><td>${(x.byType?.view||0).toLocaleString()}</td><td>${(x.byType?.copy||0).toLocaleString()}</td><td>${(x.byType?.redeem||0).toLocaleString()}</td></tr>
          `).join(''):'<tr><td colspan="5">クーポンの実測データはまだありません。</td></tr>'}
        </tbody>
      </table>
      <p style="font-size:12px;color:#777;line-height:1.7;margin-top:12px">「店員に見せる」はクーポンをスタッフに提示した回数です。「利用」は利用確定時に記録された回数です。</p>
    `}
  </section>`);
}
function design(){shell('Webデザイン','公開ページ全体の色・角丸・高さ・見出し・ボタンを変更できます.',`<div class="layout"><section class="card"><div class="section">デザイン設定</div><div class="field"><label>ブランド名</label><input id="dBrand" value="${esc(S.design.brand)}"></div><div class="field"><label>ページ見出し</label><input id="dTitle" value="${esc(S.design.pageTitle)}"></div><div class="twocol"><div class="field"><label>背景色</label><input id="dBg" type="color" value="${S.design.background}"></div><div class="field"><label>文字色</label><input id="dText" type="color" value="${S.design.textColor}"></div></div><div class="twocol"><div class="field"><label>ボタン色</label><input id="dButton" type="color" value="${S.design.buttonColor}"></div><div class="field"><label>ボタン文字色</label><input id="dButtonText" type="color" value="${S.design.buttonTextColor}"></div></div><div class="twocol"><div class="field"><label>角丸</label><input id="dRadius" type="number" value="${S.design.radius}"></div><div class="field"><label>メインビジュアル高さ</label><input id="dHero" type="number" value="${S.design.heroHeight}"></div></div><div class="field"><label>ボタン文言</label><input id="dButtonLabel" value="${esc(S.design.buttonText)}"></div><div class="actions"><button onclick="saveDesign()">デザインを保存</button><button class="secondary" onclick="window.open('/','_blank')">公開ページを見る</button></div></section><section class="card"><div class="section">リアルタイム確認</div><div class="phonewrap"><div class="phone"><iframe src="/?preview=1" title="preview"></iframe></div></div></section></div>`)}async function saveDesign(){S.design={...S.design,brand:document.getElementById('dBrand').value,pageTitle:document.getElementById('dTitle').value,background:document.getElementById('dBg').value,textColor:document.getElementById('dText').value,buttonColor:document.getElementById('dButton').value,buttonTextColor:document.getElementById('dButtonText').value,radius:+document.getElementById('dRadius').value,heroHeight:+document.getElementById('dHero').value,buttonText:document.getElementById('dButtonLabel').value};await save()}function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(m){const e=document.createElement('div');e.textContent=m;e.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:8px;z-index:99';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}load();</script></body></html>
