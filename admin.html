<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi MEDIA 管理画面</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#15171a;color:#fff;padding:22px 14px;flex:none}.logo{font-weight:800;font-size:18px;padding:8px}.logo small{display:block;color:#9da1a7;font-weight:400;font-size:10px;margin-top:4px}.nav{padding:11px 12px;margin:4px 0;border-radius:8px;color:#c9ccd1;cursor:pointer}.nav:hover,.nav.active{background:#2a2d31;color:#fff}.main{width:100%;max-width:1400px;padding:28px 34px}.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:20px}h1{font-size:26px;margin:0 0 5px}.sub{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:white;border:1px solid #e1e3e6;border-radius:14px;padding:18px}.label{font-size:12px;color:#777}.metric{font-size:28px;font-weight:800;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 420px;gap:18px}.section{font-size:16px;font-weight:800;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 7px;border-bottom:1px solid #eee;font-size:13px}th{font-size:11px;color:#777}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf7ee;font-size:11px}.off{background:#eee;color:#777}button{border:0;border-radius:8px;padding:10px 13px;background:#151515;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eceef1;color:#222}.actions{display:flex;gap:8px;flex-wrap:wrap}.phonewrap{background:#eef0f3;padding:18px;border-radius:12px}.phone{max-width:285px;margin:auto;border:8px solid #111;border-radius:28px;overflow:hidden;background:#fff}.phone iframe{display:block;width:100%;height:540px;border:0}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;padding:10px;border:1px solid #d6d9de;border-radius:8px;font:inherit;background:white}textarea{min-height:85px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalbg{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modal h2{margin-top:0}.close{float:right;background:#eee;color:#222}.previewbox{margin-top:12px;border:1px dashed #bbb;border-radius:10px;padding:10px;color:#777;font-size:12px}.pie{width:190px;height:190px;border-radius:50%;margin:8px auto;background:conic-gradient(#222 0 38%,#777 38% 67%,#bbb 67% 86%,#ddd 86% 100%);position:relative}.pie:after{content:"";position:absolute;inset:47px;background:#fff;border-radius:50%}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;color:#666}@media(max-width:1050px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.main{padding:18px 14px}.grid{grid-template-columns:1fr 1fr}.pagehead{align-items:flex-start;flex-direction:column}.twocol{grid-template-columns:1fr}.phone{max-width:320px}.phone iframe{height:560px}}</style></head><body><div class="app"><aside class="side"><div class="logo">Wi-Fi MEDIA<small>広告・店舗・効果測定</small></div><div class="nav active" onclick="dashboard()">ダッシュボード</div><div class="nav" onclick="ads()">広告管理</div><div class="nav" onclick="stores()">店舗管理</div><div class="nav" onclick="reports()">効果測定</div><div class="nav" onclick="design()">Webデザイン</div></aside><main class="main" id="main"></main></div><div class="modalbg" id="modal"><div class="modal"><button class="close" onclick="closeModal()">閉じる</button><h2 id="modalTitle">編集</h2><div id="modalBody"></div></div></div><script>let S=null;async function load(){S=await fetch('/api/state').then(r=>r.json());dashboard()}async function save(){await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});await load();toast('保存しました')}function shell(t,s,c){document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>${t}</h1><div class="sub">${s}</div></div></div>${c}`}function dashboard(){shell('ダッシュボード','Wi-Fi接続・広告配信・店舗状況をまとめて確認できます.',`<div class="grid"><div class="card"><div class="label">登録店舗</div><div class="metric">${S.stores.length}</div></div><div class="card"><div class="label">今月の接続</div><div class="metric">13,220</div></div><div class="card"><div class="label">広告クリック</div><div class="metric">942</div></div><div class="card"><div class="label">CTR</div><div class="metric">7.13%</div></div></div><div class="layout"><section class="card"><div class="section">店舗別 配信状況</div><table><thead><tr><th>店舗</th><th>広告</th><th>接続</th><th>状態</th><th></th></tr></thead><tbody>${S.stores.map((x,i)=>`<tr><td><b>${x.name}</b><br><small>${x.type}</small></td><td>${S.ad.title}</td><td>${x.users.toLocaleString()}</td><td><span class="badge ${x.status==='停止中'?'off':''}">${x.status}</span></td><td><button class="secondary" onclick="editStore(${i})">編集</button></td></tr>`).join('')}</tbody></table></section><section class="card"><div class="section">Webページ プレビュー</div><div class="phonewrap"><div class="phone"><iframe src="/" title="preview"></iframe></div></div></section></div>`)}function ads(){shell('広告管理','広告内容・掲載期間・リンク・画像/GIFを管理します.',`<div class="layout"><section class="card"><div class="section">現在の広告</div><div class="field"><label>店舗</label><select id="aStore">${S.stores.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>タイトル</label><input id="aTitle" value="${esc(S.ad.title)}"></div><div class="field"><label>本文</label><textarea id="aBody">${esc(S.ad.body)}</textarea></div><div class="twocol"><div class="field"><label>掲載開始</label><input id="aStart" type="date" value="${S.ad.start}"></div><div class="field"><label>掲載終了</label><input id="aEnd" type="date" value="${S.ad.end}"></div></div><div class="field"><label>「詳しく見る」のリンク先</label><input id="aLink" type="url" value="${esc(S.ad.link)}" placeholder="https://..."></div><div class="field"><label>画像 / GIF</label><input id="aFile" type="file" accept=".gif,image/gif,image/png,image/jpeg,image/webp"><div class="previewbox">GIFを選ぶとサーバーへアップロードし、公開ページのメインビジュアルとして表示できます。</div></div><div class="actions"><button onclick="publishAd()">保存して公開</button><button class="secondary" onclick="window.open('/','_blank')">公開ページを開く</button></div></section><section class="card"><div class="section">広告プレビュー</div><div class="phonewrap"><div class="phone"><iframe src="/" title="preview"></iframe></div></div></section></div>`)}async function publishAd(){const f=document.getElementById('aFile').files[0];let media=S.ad.media;if(f){const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json();if(j.error){alert(j.error);return}media=j.url}S.ad={...S.ad,store:document.getElementById('aStore').value,title:document.getElementById('aTitle').value,body:document.getElementById('aBody').value,start:document.getElementById('aStart').value,end:document.getElementById('aEnd').value,link:document.getElementById('aLink').value,media,published:true};await save()}function stores(){shell('店舗管理','Wi-Fiを設置している店舗・ホテル・拠点を管理します.',`<div class="card"><div class="actions" style="justify-content:flex-end;margin-bottom:12px"><button onclick="addStore()">＋ 店舗を追加</button></div><table><thead><tr><th>店舗</th><th>業態</th><th>Wi-Fi</th><th>月間接続</th><th>状態</th><th></th></tr></thead><tbody>${S.stores.map((x,i)=>`<tr><td><b>${x.name}</b></td><td>${x.type}</td><td>${x.wifi}</td><td>${x.users.toLocaleString()}</td><td>${x.status}</td><td><button class="secondary" onclick="editStore(${i})">編集</button></td></tr>`).join('')}</tbody></table></div>`)}function editStore(i){const x=S.stores[i];openModal('店舗を編集',`<div class="field"><label>店舗名</label><input id="sName" value="${esc(x.name)}"></div><div class="field"><label>業態</label><input id="sType" value="${esc(x.type)}"></div><div class="field"><label>Wi-Fi</label><input id="sWifi" value="${esc(x.wifi)}"></div><div class="field"><label>月間接続数</label><input id="sUsers" type="number" value="${x.users}"></div><div class="field"><label>状態</label><select id="sStatus"><option ${x.status==='稼働中'?'selected':''}>稼働中</option><option ${x.status==='停止中'?'selected':''}>停止中</option></select></div><button onclick="saveStore(${i})">保存</button>`)}function addStore(){S.stores.push({id:Date.now().toString(),name:'新規店舗',type:'店舗',wifi:'Guest Wi-Fi',users:0,clicks:0,status:'稼働中'});stores();save()}function saveStore(i){const x=S.stores[i];x.name=document.getElementById('sName').value;x.type=document.getElementById('sType').value;x.wifi=document.getElementById('sWifi').value;x.users=+document.getElementById('sUsers').value;x.status=document.getElementById('sStatus').value;closeModal();save()}async function reports(){const a=await fetch('/api/analytics').then(r=>r.json());const prev=S.history[S.history.length-1]||{ctr:0};shell('効果測定','実際のWebページの表示・クリックを自動で記録します.',`<div class="grid"><div class="card"><div class="label">累計表示回数</div><div class="metric">${a.impressions.toLocaleString()}</div></div><div class="card"><div class="label">累計クリック</div><div class="metric">${a.clicks.toLocaleString()}</div></div><div class="card"><div class="label">実測CTR</div><div class="metric">${a.ctr}%</div></div><div class="card"><div class="label">記録件数</div><div class="metric">${(a.impressions+a.clicks).toLocaleString()}</div></div></div><div class="layout"><section class="card"><div class="section">日別の実測データ</div><table><thead><tr><th>日付</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead><tbody>${a.daily.length?a.daily.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>`).join(''):'<tr><td colspan="4">まだ実測データがありません。公開ページを開くと表示回数が記録されます。</td></tr>'}</tbody></table></section><section class="card"><div class="section">店舗別の実測データ</div><table><thead><tr><th>店舗</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead><tbody>${Object.keys(a.byStore).length?Object.entries(a.byStore).map(([k,x])=>`<tr><td>${k}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.impressions?((x.clicks/x.impressions)*100).toFixed(2):'0.00'}%</td></tr>`).join(''):'<tr><td colspan="4">まだ店舗別データがありません。</td></tr>'}</tbody></table><p style="font-size:12px;color:#777;line-height:1.7;margin-top:14px">※この試作では、個人を特定する情報は保存せず、「表示」「クリック」「店舗」「日時」だけを記録しています。</p></section></div><div class="card" style="margin-top:18px"><div class="section">過去データ（デモ）</div><table><thead><tr><th>月</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead><tbody>${S.history.map(x=>`<tr><td>${x.month}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>`).join('')}</tbody></table></div>`)}
function design(){shell('Webデザイン','公開ページ全体の色・角丸・高さ・見出し・ボタンを変更できます.',`<div class="layout"><section class="card"><div class="section">デザイン設定</div><div class="field"><label>ブランド名</label><input id="dBrand" value="${esc(S.design.brand)}"></div><div class="field"><label>ページ見出し</label><input id="dTitle" value="${esc(S.design.pageTitle)}"></div><div class="twocol"><div class="field"><label>背景色</label><input id="dBg" type="color" value="${S.design.background}"></div><div class="field"><label>文字色</label><input id="dText" type="color" value="${S.design.textColor}"></div></div><div class="twocol"><div class="field"><label>ボタン色</label><input id="dButton" type="color" value="${S.design.buttonColor}"></div><div class="field"><label>ボタン文字色</label><input id="dButtonText" type="color" value="${S.design.buttonTextColor}"></div></div><div class="twocol"><div class="field"><label>角丸</label><input id="dRadius" type="number" value="${S.design.radius}"></div><div class="field"><label>メインビジュアル高さ</label><input id="dHero" type="number" value="${S.design.heroHeight}"></div></div><div class="field"><label>ボタン文言</label><input id="dButtonLabel" value="${esc(S.design.buttonText)}"></div><div class="actions"><button onclick="saveDesign()">デザインを保存</button><button class="secondary" onclick="window.open('/','_blank')">公開ページを見る</button></div></section><section class="card"><div class="section">リアルタイム確認</div><div class="phonewrap"><div class="phone"><iframe src="/" title="preview"></iframe></div></div></section></div>`)}async function saveDesign(){S.design={...S.design,brand:document.getElementById('dBrand').value,pageTitle:document.getElementById('dTitle').value,background:document.getElementById('dBg').value,textColor:document.getElementById('dText').value,buttonColor:document.getElementById('dButton').value,buttonTextColor:document.getElementById('dButtonText').value,radius:+document.getElementById('dRadius').value,heroHeight:+document.getElementById('dHero').value,buttonText:document.getElementById('dButtonLabel').value};await save()}function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(m){const e=document.createElement('div');e.textContent=m;e.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:8px;z-index:99';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}load();</script></body></html>
