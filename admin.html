/* Wi-Fi MEDIA night-operations theme */
:root {
  --night-bg: #111214;
  --night-panel: #24272c;
  --night-raised: #2b2f36;
  --night-edge: #3b414a;
  --night-edge-soft: #32373e;
  --night-text: #f1f3f6;
  --night-muted: #a6adb7;
  --neon-green: #b7ff56;
  --signal-cyan: #4ce5ff;
  --signal-purple: #B45CFF;
}
body {
  background-color: var(--night-bg);
  background-image:
    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--night-text);
}
.side {
  background: #191b20;
  border-right: 1px solid var(--night-edge);
  box-shadow: 4px 0 20px #0003;
}
.logo small, .nav { color: var(--night-muted); }
.nav { border-radius: 6px; transition: background .18s, color .18s, box-shadow .18s; }
.nav:hover, .nav.active {
  color: var(--night-text);
  background: #252a31;
  box-shadow: inset 2px 0 0 var(--signal-cyan), 0 0 10px #4ce5ff12;
}
.main { color: var(--night-text); }
.pagehead { border-bottom: 1px solid var(--night-edge-soft); }
.sub, .label, th, .legend, .previewbox { color: var(--night-muted); }
.card {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  box-shadow: 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}
.grid > .card {
  background: var(--night-raised);
  border-color: #414751;
}
.section { color: var(--night-text); border-bottom: 1px solid var(--night-edge-soft); }
.metric { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
.metric.connection, .metric.impression, .metric.coupon-view { color: var(--neon-green); text-shadow: 0 0 12px #b7ff5628; }
.metric.click, .metric.coupon-copy { color: var(--signal-cyan); text-shadow: 0 0 12px #4ce5ff28; }
.metric.ctr, .metric.coupon-redeem { color: var(--signal-purple); text-shadow: 0 0 12px rgba(180,92,255,.16); }
.metric.store, .metric.record, .metric.coupon-total { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
table { color: var(--night-text); }
th { color: #dce2e9; background: #1c1f24; border-bottom-color: var(--night-edge); }
td { color: #e5e8ed; border-bottom-color: var(--night-edge-soft); }
tbody tr:hover td { background: #30353d; }
.badge {
  color: #d6ff9d;
  background: #263621;
  border: 1px solid #52703a;
  border-radius: 5px;
  box-shadow: 0 0 8px #b7ff5610;
}
.off {
  color: #dfbdff;
  background: #2d2439;
  border-color: #60477a;
  box-shadow: 0 0 8px rgba(180,92,255,.06);
}
button {
  color: #eff5f7;
  background: #30353d;
  border: 1px solid #505862;
  border-radius: 6px;
  box-shadow: 0 2px 7px #0004;
  transition: border-color .16s, background .16s, box-shadow .16s, transform .16s;
}
button:hover {
  color: var(--night-text);
  background: #343d43;
  border-color: var(--signal-cyan);
  box-shadow: 0 0 9px #4ce5ff22;
}
button:active { transform: translateY(1px); }
button.secondary {
  color: #e0e5eb;
  background: #282c32;
  border-color: #424851;
  box-shadow: none;
}
button.secondary:hover { border-color: var(--neon-green); box-shadow: 0 0 8px #b7ff5618; }
input, textarea, select {
  color: var(--night-text);
  background: #1b1e23;
  border-color: #444a54;
  border-radius: 6px;
  color-scheme: dark;
}
input::placeholder, textarea::placeholder { color: #7f8791; }
input:focus, textarea:focus, select:focus {
  outline: 1px solid var(--signal-cyan);
  border-color: var(--signal-cyan);
  box-shadow: 0 0 8px #4ce5ff20;
}
.modalbg { background: #050608c9; backdrop-filter: blur(3px); }
.modal {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid #4a515b;
  border-radius: 10px;
  box-shadow: 0 12px 40px #0009, 0 0 18px #4ce5ff12;
}
.modal h2 { color: var(--night-text); }
.close { color: var(--night-text); background: #30353d; }
.close:hover { border-color: var(--signal-purple); box-shadow: 0 0 8px rgba(180,92,255,.11); }
.previewbox { color: var(--night-muted); background: #1d2025; border-color: #444a54; }
.phonewrap { background: #1b1e23; border: 1px solid var(--night-edge); border-radius: 8px; }
.phone { background: #0b0c0e; border-color: #070809; border-radius: 12px; }
.pie {
  background: conic-gradient(
    var(--neon-green) 0 var(--view-end),
    var(--signal-cyan) var(--view-end) var(--copy-end),
    var(--signal-purple) var(--copy-end) 100%
  );
  box-shadow: 0 0 12px #4ce5ff12;
}
.pie:after { background: var(--night-panel); }
.pie.is-empty { background: conic-gradient(#414751 0 100%); box-shadow: none; }
.pie-total {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  color: var(--night-text);
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.coupon-chart {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  align-items: center;
  gap: 20px;
  max-width: 500px;
  margin: 8px auto 22px;
  padding: 8px 14px;
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  background: #202329;
}
.coupon-legend { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.coupon-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 9px; color: var(--night-muted); font-size: 13px; }
.coupon-legend strong { color: var(--night-text); font-size: 14px; font-variant-numeric: tabular-nums; }
.coupon-swatch { width: 9px; height: 9px; border-radius: 2px; }
.coupon-swatch-view { background: var(--neon-green); box-shadow: 0 0 6px #b7ff5630; }
.coupon-swatch-copy { background: var(--signal-cyan); box-shadow: 0 0 6px #4ce5ff30; }
.coupon-swatch-redeem { background: var(--signal-purple); box-shadow: 0 0 6px rgba(180,92,255,.19); }
.legend { color: var(--night-muted); }
.comparison-meter {
  height: 4px;
  min-width: 42px;
  margin-top: 5px;
  overflow: hidden;
  background: #191c20;
  border: 1px solid #3a4149;
  border-radius: 2px;
}
.comparison-meter > span { display: block; width: var(--bar-width); height: 100%; }
.comparison-meter.impression > span {
  background: linear-gradient(90deg, #568d31, var(--neon-green));
  border-right: 1px solid #dcffb0;
  box-shadow: 0 0 6px #b7ff5638;
}
.comparison-meter.click > span {
  background: linear-gradient(90deg, #246b80, var(--signal-cyan));
  border-right: 1px solid #c1f8ff;
  box-shadow: 0 0 6px #4ce5ff38;
}
.card i[title^="表示"] {
  background-color: var(--neon-green) !important;
  box-shadow: 0 0 8px #b7ff5630;
}
.card i[title^="クリック"] {
  background-color: var(--signal-cyan) !important;
  box-shadow: 0 0 8px #4ce5ff30;
}
@media (max-width: 700px) {
  .side { border-right: 0; border-bottom: 1px solid var(--night-edge); box-shadow: 0 4px 16px #0003; }
  .coupon-chart { grid-template-columns: 1fr; justify-items: center; gap: 8px; padding: 14px; }
  .coupon-legend { width: min(100%, 280px); }
}

/* STEP A-2: subtle neon panel edges */
.card, .modal, .phonewrap {
  border-color: #3a4650;
  box-shadow:
    0 0 0 1px rgba(76, 229, 255, .045),
    0 6px 20px rgba(0, 0, 0, .28),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.grid > .card {
  border-color: #46504e;
  box-shadow:
    0 0 0 1px rgba(183, 255, 86, .035),
    0 6px 18px rgba(0, 0, 0, .3),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.previewbox {
  border-color: #3d4951;
  box-shadow: 0 0 10px rgba(76, 229, 255, .035);
}

/* STEP A-3: terminal identity labels */
.pagehead {
  position: relative;
  padding-top: 18px;
}
.pagehead::before {
  position: absolute;
  top: 0;
  left: 0;
  content: "SYSTEM STATUS";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  line-height: 1;
  text-shadow: 0 0 6px rgba(76, 229, 255, .3);
}
.logo small {
  font-size: 0;
  line-height: 1.5;
  letter-spacing: .16em;
}
.logo small::before {
  content: "CONTROL SYSTEM";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  text-shadow: 0 0 6px rgba(76, 229, 255, .24);
}

/* STEP A-4: terminal status badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #d6ff9d;
  background: #263621;
  border-color: #52703a;
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(183, 255, 86, .08);
  letter-spacing: .04em;
}
.badge::before {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  content: "";
  background: var(--neon-green);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(183, 255, 86, .55);
}
.badge.off {
  color: #a4abb4;
  background: #22262b;
  border-color: #41474f;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}
.badge.off::before {
  background: #727a84;
  box-shadow: none;
}

/* STEP B-1: terminal bar chart */
.card div[style*="min-height:170px"] {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    rgba(166, 186, 198, .09) 31px,
    rgba(166, 186, 198, .09) 32px
  );
  background-size: 100% 32px;
  border-bottom: 1px solid rgba(166, 186, 198, .16);
}
.card i[title^="表示"] {
  background-color: #88e943 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(15, 30, 8, .18) 5px 6px),
    linear-gradient(0deg, #538a2e 0%, #b7ff56 100%) !important;
  border: 1px solid rgba(211, 255, 163, .52);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(183, 255, 86, .2);
}
.card i[title^="クリック"] {
  background-color: #39cce5 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(4, 20, 28, .18) 5px 6px),
    linear-gradient(0deg, #246b80 0%, #4ce5ff 100%) !important;
  border: 1px solid rgba(157, 243, 255, .5);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(76, 229, 255, .2);
}

/* STEP D-1A: restrained CRT treatment, dashboard only */
.dashboard-view {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(205, 245, 255, .018) 0,
    rgba(205, 245, 255, .018) 1px,
    transparent 1px,
    transparent 4px
  );
}
.dashboard-view .metric.connection {
  text-shadow: 0 0 2px rgba(183, 255, 86, .68), 0 0 7px rgba(183, 255, 86, .3), 0 0 14px rgba(183, 255, 86, .12);
}
.dashboard-view .metric.click {
  text-shadow: 0 0 2px rgba(76, 229, 255, .68), 0 0 7px rgba(76, 229, 255, .3), 0 0 14px rgba(76, 229, 255, .12);
}
.dashboard-view .metric.ctr {
  text-shadow: 0 0 2px rgba(180,92,255,.62), 0 0 7px rgba(180,92,255,.28), 0 0 14px rgba(180,92,255,.1);
}
.dashboard-view .dashboard-connection-card { --dashboard-accent: rgba(183, 255, 86, .34); }
.dashboard-view .dashboard-click-card { --dashboard-accent: rgba(76, 229, 255, .34); }
.dashboard-view .dashboard-ctr-card { --dashboard-accent: rgba(180,92,255,.3); }
.dashboard-view .dashboard-metric-card {
  border-top-color: var(--dashboard-accent);
  box-shadow: inset 0 1px 0 var(--dashboard-accent), 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}

.logo {
  text-shadow: 0 0 3px rgba(76, 229, 255, .42), 0 0 9px rgba(76, 229, 255, .18);
}
.nav.active {
  background: linear-gradient(90deg, rgba(183, 255, 86, .1), rgba(76, 229, 255, .09) 48%, #252a31);
  box-shadow: inset 2px 0 0 var(--neon-green), inset 0 0 0 1px rgba(76, 229, 255, .16), 0 0 10px rgba(76, 229, 255, .1);
}
/* STEP D-1B: dashboard CRT console treatment */
.dashboard-view {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(205, 245, 255, .026) 0,
    rgba(205, 245, 255, .026) 1px,
    transparent 1px,
    transparent 4px
  );
}
.dashboard-title {
  display: block;
  color: #9fffa6;
  font-family: "Orbitron", "IBM Plex Sans JP", sans-serif;
  font-size: clamp(34px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: .015em;
  line-height: 1.04;
  text-shadow: 0 0 3px rgba(183, 255, 86, .65), 0 0 10px rgba(76, 229, 255, .4), 0 0 22px rgba(76, 229, 255, .18);
}
.dashboard-title-ja {
  display: block;
  margin-top: 5px;
  color: var(--night-muted);
  font-family: "IBM Plex Sans JP", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  line-height: 1.5;
}
.dashboard-system-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: -2px 0 16px;
  padding: 9px 12px;
  background: linear-gradient(90deg, rgba(20, 33, 35, .82), rgba(17, 20, 22, .72));
  border: 1px solid rgba(76, 229, 255, .2);
  border-left: 2px solid rgba(76, 229, 255, .52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.dashboard-console-name { color: #c8f9ff; font-size: 11px; letter-spacing: .07em; }
.dashboard-console-message { margin-top: 3px; color: #98a7a9; font-size: 10px; }
.dashboard-online, .dashboard-connected {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #c7ff94;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  white-space: nowrap;
}
.dashboard-online i, .dashboard-connected i {
  width: 6px;
  height: 6px;
  display: inline-block;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 5px rgba(183, 255, 86, .65), 0 0 10px rgba(183, 255, 86, .25);
}
.dashboard-view .dashboard-metric-card {
  --dashboard-edge: rgba(76, 229, 255, .25);
  position: relative;
  overflow: hidden;
  color: var(--night-text);
  background-color: #15181b;
  background-image:
    repeating-linear-gradient(to bottom, rgba(205, 245, 255, .035) 0 1px, transparent 1px 4px),
    linear-gradient(rgba(76, 229, 255, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(76, 229, 255, .028) 1px, transparent 1px);
  background-size: 100% 4px, 22px 22px, 22px 22px;
  border: 1px solid var(--dashboard-edge);
  border-top-color: rgba(76, 229, 255, .48);
  box-shadow: inset 0 1px 0 rgba(157, 243, 255, .06), 0 5px 16px rgba(0, 0, 0, .36), 0 0 8px rgba(76, 229, 255, .045);
}
.dashboard-view .dashboard-store-card { --dashboard-edge: rgba(183, 255, 86, .2); border-top-color: rgba(183, 255, 86, .42); }
.dashboard-view .dashboard-connection-card { --dashboard-edge: rgba(183, 255, 86, .26); border-top-color: rgba(183, 255, 86, .58); }
.dashboard-view .dashboard-click-card { --dashboard-edge: rgba(76, 229, 255, .28); border-top-color: rgba(76, 229, 255, .58); }
.dashboard-view .dashboard-ctr-card { --dashboard-edge: rgba(180,92,255,.22); border-top-color: rgba(180,92,255,.48); }
.dashboard-view .metric.connection {
  text-shadow: 0 0 2px rgba(183, 255, 86, .78), 0 0 7px rgba(183, 255, 86, .46), 0 0 16px rgba(183, 255, 86, .24), 0 0 25px rgba(183, 255, 86, .1);
}
.dashboard-view .metric.click {
  text-shadow: 0 0 2px rgba(76, 229, 255, .78), 0 0 7px rgba(76, 229, 255, .46), 0 0 16px rgba(76, 229, 255, .24), 0 0 25px rgba(76, 229, 255, .1);
}
.dashboard-view .metric.ctr {
  text-shadow: 0 0 2px rgba(180,92,255,.68), 0 0 7px rgba(180,92,255,.38), 0 0 16px rgba(180,92,255,.18);
}
.dashboard-view .dashboard-delivery-section {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
.dashboard-terminal-label {
  display: block;
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: .16em;
  line-height: 1.4;
  text-shadow: 0 0 5px rgba(76, 229, 255, .24);

  if(dashboardPcPreviewResizeHandler){window.removeEventListener('resize',dashboardPcPreviewResizeHandler);dashboardPcPreviewResizeHandler=null;}
}
function observeDashboardPcPreviewScale(){
  disposeDashboardPcPreviewScale();
  const viewport=document.getElementById('dashboardPcPreviewViewport');
  if(!viewport)return;
  if(typeof ResizeObserver==='function'){
    dashboardPcPreviewObserver=new ResizeObserver(updateDashboardPcPreviewScale);
    dashboardPcPreviewObserver.observe(viewport);
  }else{
    dashboardPcPreviewResizeHandler=updateDashboardPcPreviewScale;
    window.addEventListener('resize',dashboardPcPreviewResizeHandler,{passive:true});
  }
  updateDashboardPcPreviewScale();
}

async function loadDashboardKpis(){
  const requestId=++dashboardKpiRequestSeq;
  if(dashboardKpiAbortController)dashboardKpiAbortController.abort();
  dashboardKpiAbortController=typeof AbortController==='function'?new AbortController():null;
  const selectedScope=dashboardSelectedCompany;
  clearDashboardKpis(false);
  try{
    const response=await apiFetch(dashboardKpiRequestUrl(selectedScope),dashboardKpiAbortController?{signal:dashboardKpiAbortController.signal}:{});
    if(!response.ok)throw new Error('dashboard analytics request failed');
    const data=await response.json();
    if(requestId!==dashboardKpiRequestSeq||selectedScope!==dashboardSelectedCompany||location.hash!=='#dashboard')return;
    document.getElementById('dashboardStoreCount').textContent=Number(data.storeCount||0).toLocaleString();
    document.getElementById('dashboardImpressions').textContent=Number(data.impressions||0).toLocaleString();
    document.getElementById('dashboardClicks').textContent=Number(data.clicks||0).toLocaleString();
    document.getElementById('dashboardCtr').textContent=Number(data.ctr||0).toFixed(2)+'%';
  }catch(error){
    if(error?.name==='AbortError'||requestId!==dashboardKpiRequestSeq||selectedScope!==dashboardSelectedCompany)return;
    clearDashboardKpis(true);
  }
}

function secureAdCreateKey(){
  const cryptoApi=window.crypto;
  try{
    if(typeof cryptoApi?.randomUUID==='function')return cryptoApi.randomUUID();
    if(typeof cryptoApi?.getRandomValues==='function'){
      const bytes=cryptoApi.getRandomValues(new Uint8Array(16));
      return Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('');
    }
  }catch(_){return null;}
  return null;
}
function resetAdCreateIdempotency(){
  adCreateIdempotencyKey=null;adCreateAttempt=null;adCreateUncertain=false;adCreateBlocked=false;adCreateStoreId=null;
}
function beginAdCreateIdempotency(storeId){
  const key=secureAdCreateKey();
  if(!key)return false;
  adCreateIdempotencyKey=key;adCreateAttempt=null;adCreateUncertain=false;adCreateBlocked=false;adCreateStoreId=String(storeId);
  return true;
}
function rotateAdCreateIdempotency(storeId){
  const key=secureAdCreateKey();
  if(!key){adCreateIdempotencyKey=null;adCreateAttempt=null;adCreateUncertain=false;adCreateBlocked=true;adCreateStoreId=String(storeId);return false;}
  adCreateIdempotencyKey=key;adCreateAttempt=null;adCreateUncertain=false;adCreateBlocked=false;adCreateStoreId=String(storeId);return true;
}

function displayCampaignDate(value){
  if(typeof value!=='string'||!(/^\d{4}-\d{2}-\d{2}$/).test(value))return '日付不明';
  return value.replace(/-/g,'/');
}
function tokyoTodayIso(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const values=Object.fromEntries(parts.filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}
function isValidCampaignDate(value){
  if(typeof value!=='string'||!(/^\d{4}-\d{2}-\d{2}$/).test(value))return false;
  const [year,month,day]=value.split('-').map(Number);
  if(year<1)return false;
  const parsed=new Date(Date.UTC(year,month-1,day));
  return parsed.getUTCFullYear()===year&&parsed.getUTCMonth()===month-1&&parsed.getUTCDate()===day;
}
function storeCampaignStatus(campaign,today=tokyoTodayIso()){
  if(campaign?.status!=='active'||campaign?.published!==true)return {label:'非公開',className:'is-off'};
  const startsOn=campaign.startsOn,endsOn=campaign.endsOn;
  if((startsOn!==null&&startsOn!==undefined&&!isValidCampaignDate(startsOn))||(endsOn!==null&&endsOn!==undefined&&!isValidCampaignDate(endsOn))||!isValidCampaignDate(today))return {label:'期間エラー',className:'is-period-error'};
  if(startsOn&&endsOn&&startsOn>endsOn)return {label:'期間エラー',className:'is-period-error'};
  if(startsOn&&startsOn>today)return {label:'公開予定',className:'is-scheduled'};
  if(endsOn&&endsOn<today)return {label:'掲載終了',className:'is-ended'};
  return {label:'公開中',className:'is-live'};
}
function displayCampaignPeriod(campaign){
  const start=campaign.startsOn?displayCampaignDate(campaign.startsOn):'';
  const end=campaign.endsOn?displayCampaignDate(campaign.endsOn):'';
  if(!start&&!end)return '常時';
  if(start&&!end)return `${start} 〜`;
  if(!start&&end)return `〜 ${end}`;
  return `${start} - ${end}`;
}

async function uploadAdImage(file){

  if(!response.ok||typeof result?.url!=='string'||!result.url){
    return {url:null,message:response.ok?'画像をアップロードできませんでした。':storeSaveErrorMessage(response.status)};
  }
  return {url:result.url,message:''};

async function loadStorePublicCodes(){
  const seq=++storePublicCodeSeq;
  storePublicCodes=new Map();storePublicCodeLoading=true;storePublicCodeError='';
  renderStores();
  try{
    const response=await companyApiFetch('/api/admin/stores');
    if(!response.ok)throw new Error(String(response.status));
    const payload=await response.json();
    if(!Array.isArray(payload.stores))throw new Error('invalid response');
    if(seq!==storePublicCodeSeq)return;
    storePublicCodes=new Map(payload.stores.filter(store=>store&&store.id!==undefined&&store.id!==null).map(store=>[String(store.id),store.publicCode]));
    storePublicCodeLoading=false;
  }catch(_){
    if(seq!==storePublicCodeSeq)return;
    storePublicCodes=new Map();storePublicCodeLoading=false;storePublicCodeError='取得できません';
  }
  if(document.querySelector('.store-management-view'))renderStores();
}
function storePublicUrl(publicCode){
  if(typeof publicCode!=='string'||!publicCode||publicCode.length>128||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(publicCode))return null;
  try{const url=new URL('/',window.location.origin);url.searchParams.set('store',publicCode);return url.toString();}catch(_){return null;}
}
function storePublicUrlForId(storeId){return storePublicUrl(storePublicCodes.get(String(storeId)));}
async function copyStorePublicUrl(fullUrl){
  try{
    if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
      await navigator.clipboard.writeText(fullUrl);return true;
    }
  }catch(_){/* Use the local fallback below. */}
  const field=document.createElement('textarea');
  field.value=fullUrl;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';field.style.pointerEvents='none';
  document.body.appendChild(field);field.select();field.setSelectionRange(0,field.value.length);
  let copied=false;try{copied=document.execCommand('copy');}catch(_){copied=false;}field.remove();
  if(!copied&&typeof window.prompt==='function')window.prompt('コピーできませんでした。URLをコピーしてください。',fullUrl);
  return copied;
}

function newStoreId(){
  const cryptoApi=window.crypto;
  let candidate='';
  try{candidate=typeof cryptoApi?.randomUUID==='function'?`store-${cryptoApi.randomUUID()}`:'';}catch{}
  if(!candidate)candidate=`store-${Date.now()}-${Math.random().toString(36).slice(2,12)}`;
  while(S.stores.some(store=>String(store.id)===candidate))candidate=`store-${Date.now()}-${Math.random().toString(36).slice(2,12)}`;
  return candidate;
}

async function saveStore(event){
  event.preventDefault();if(storeSavePending)return;
  const form=document.getElementById('storeEditForm');if(!form)return;
  const isNew=form.dataset.isNew==='true', storeId=form.dataset.storeId;
  if(!storeId)return;
  const name=document.getElementById('sName').value.trim();
  if(!name){alert('店舗名を入力してください。');return;}
  const selectedCompanyId=document.getElementById('sCompanyId').value;
  const companyId=selectedCompanyId===''?null:selectedCompanyId;
  const originalCompanyId=form.dataset.originalCompanyId||'';
  const companyChanged=isNew?companyId!==null:String(companyId??'')!==String(originalCompanyId);
  const source=isNew?{id:storeId,name:'',type:'店舗',wifi:'Guest Wi-Fi',users:0,clicks:0,status:'稼働中'}:S.stores.find(store=>String(store.id)===String(storeId));
  if(!source){storeSaveFeedback='編集対象の店舗を確認できません。店舗一覧を再読み込みしてください。';storeSaveFeedbackType='error';closeModal();renderStores();return;}
  const updatedStore={...source,name,type:document.getElementById('sType').value.trim(),wifi:document.getElementById('sWifi').value.trim(),users:Math.max(0,Number(document.getElementById('sUsers').value)||0),status:document.getElementById('sStatus').value};
  const nextState={...S,stores:isNew?[...S.stores,updatedStore]:S.stores.map(store=>String(store.id)===String(storeId)?updatedStore:store)};
  storeSavePending=true;storeSaveFeedback='';storeSaveFeedbackType='';let storeSaved=false;
  const submitButton=form.querySelector('button[type="submit"]');if(submitButton){submitButton.disabled=true;submitButton.textContent='保存中…';}
  try{
    const saveResponse=await apiFetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(nextState)});
    if(!saveResponse.ok)throw new Error('店舗情報を保存できませんでした。');
    storeSaved=true;
    const savedState=await refreshStoreState();
    const savedStore=savedState.stores.find(store=>String(store.id)===String(storeId));
    if(!savedStore)throw new Error('店舗本体は保存されましたが、保存結果から対象店舗を確認できませんでした。');
    if(isNew){
      const storesResponse=await companyApiFetch('/api/admin/stores');
      if(!storesResponse.ok)throw new Error('店舗本体は保存されましたが、所属企業を更新できませんでした。店舗IDを確認できません。');
      const storesPayload=await storesResponse.json();
      const verified=Array.isArray(storesPayload.stores)&&storesPayload.stores.some(store=>String(store.id)===String(storeId));
      if(!verified)throw new Error('店舗本体は保存されましたが、所属企業を更新できませんでした。対象店舗を安全に確認できません。');
    }
    if(companyChanged){
      const companyResponse=await companyApiFetch(`/api/admin/stores/${encodeURIComponent(storeId)}/company`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({companyId})});
      if(!companyResponse.ok){
        const reason=companyApiError(new Error(String(companyResponse.status)),'企業所属を更新できませんでした。');
        await refreshStoreState().catch(()=>{});await refreshStoreCompanyData().catch(()=>{});
        throw new Error(`店舗は保存されましたが、所属企業を更新できませんでした。${reason}`);
      }
      try{await refreshStoreState();await refreshStoreCompanyData();}
      catch{storeSaveFeedback='店舗情報と所属企業は保存されましたが、最新状態の再取得に失敗しました。画面を再読み込みしてください。';storeSaveFeedbackType='error';}
    }else{
      await refreshStoreCompanyData().catch(()=>{});
    }
    closeModal();
    if(!storeSaveFeedback){storeSaveFeedback='店舗情報を保存しました。';storeSaveFeedbackType='success';}
    renderStores();
  }catch(error){
    closeModal();
    if(!storeSaveFeedback){
      if(storeSaved){storeSaveFeedback=error.message?.startsWith('店舗は保存されました')||error.message?.startsWith('店舗本体は保存されました')?error.message:'店舗は保存されましたが、所属企業の状態を確認できませんでした。最新状態を再読み込みしてください。';storeSaveFeedbackType='error';await refreshStoreState().catch(()=>{});await refreshStoreCompanyData().catch(()=>{});}
      else{storeSaveFeedback=error.message||'店舗を保存できませんでした。';storeSaveFeedbackType='error';}
    }
    renderStores();
  }finally{storeSavePending=false;}
}

        <ul class="coupon-legend">
          <li><span class="coupon-swatch coupon-swatch-view"></span><span>表示</span><strong>${couponEventCounts.view.toLocaleString()}件</strong></li>
          <li><span class="coupon-swatch coupon-swatch-copy"></span><span>店員に見せる</span><strong>${couponEventCounts.copy.toLocaleString()}件</strong></li>
          <li><span class="coupon-swatch coupon-swatch-redeem"></span><span>利用</span><strong>${couponEventCounts.redeem.toLocaleString()}件</strong></li>
        </ul>
      </div>
      <table>
        <thead><tr><th>クーポンコード</th><th>イベント合計</th><th>表示</th><th>店員に見せる</th><th>利用</th></tr></thead>
        <tbody>
          ${couponAnalytics.byCoupon?.length?couponAnalytics.byCoupon.map(x=>`
            <tr><td>${esc(x.couponCode||'（コードなし）')}</td><td>${(x.total||0).toLocaleString()}</td><td>${(x.byType?.view||0).toLocaleString()}</td><td>${(x.byType?.copy||0).toLocaleString()}</td><td>${(x.byType?.redeem||0).toLocaleString()}</td></tr>
          `).join(''):'<tr><td colspan="5">クーポンの実測データはまだありません。</td></tr>'}
        </tbody>
      </table>
      <p style="font-size:12px;color:#777;line-height:1.7;margin-top:12px">「店員に見せる」はクーポンをスタッフに提示した回数です。「利用」は利用確定時に記録された回数です。</p>
    `}
  </section></div>`);
}
function design(){shell('<span class="web-design-title">WEB DESIGN</span><span class="web-design-title-ja">Webデザイン</span>','公開ページ全体の色・角丸・高さ・見出し・ボタンを変更できます.',`<div class="web-design-view"><div class="web-design-system-status"><div><div class="web-design-console-name">WEB APPEARANCE CONTROL</div><div class="web-design-console-message">Editing public Wi-Fi interface configuration.</div></div><span class="web-design-live"><i></i> LIVE PREVIEW</span></div><div class="layout web-design-layout"><section class="card web-design-panel web-design-config-panel"><div class="web-design-panel-heading"><span class="web-design-terminal-label">INTERFACE CONFIGURATION</span><div class="section">デザイン設定</div></div><div class="field"><label>ブランド名</label><input id="dBrand" value="${esc(S.design.brand)}"></div><div class="field"><label>ページ見出し</label><input id="dTitle" value="${esc(S.design.pageTitle)}"></div><div class="twocol"><div class="field"><label>背景色</label><input id="dBg" type="color" value="${S.design.background}"></div><div class="field"><label>文字色</label><input id="dText" type="color" value="${S.design.textColor}"></div></div><div class="twocol"><div class="field"><label>ボタン色</label><input id="dButton" type="color" value="${S.design.buttonColor}"></div><div class="field"><label>ボタン文字色</label><input id="dButtonText" type="color" value="${S.design.buttonTextColor}"></div></div><div class="twocol"><div class="field"><label>角丸</label><input id="dRadius" type="number" value="${S.design.radius}"></div><div class="field"><label>メインビジュアル高さ</label><input id="dHero" type="number" value="${S.design.heroHeight}"></div></div><div class="field"><label>ボタン文言</label><input id="dButtonLabel" value="${esc(S.design.buttonText)}"></div><div class="actions web-design-actions"><button class="web-design-primary" onclick="saveDesign()">デザインを保存</button><button class="secondary web-design-secondary" onclick="window.open('/','_blank')">公開ページを見る</button></div></section><section class="card web-design-panel web-design-preview-panel"><div class="web-design-preview-head"><div><span class="web-design-terminal-label">LIVE WEB PREVIEW</span><div class="section">リアルタイム確認</div></div><span class="web-design-connected"><i></i> CONNECTED</span></div><div class="phonewrap web-design-crt-frame"><div class="phone web-design-phone"><iframe src="/?preview=1" title="preview"></iframe></div></div><div class="web-design-preview-footer"><span>PREVIEW MODE : LIVE</span><span class="web-design-signal"><i></i><i></i><i></i></span></div></section></div></div>`)}async function saveDesign(){S.design={...S.design,brand:document.getElementById('dBrand').value,pageTitle:document.getElementById('dTitle').value,background:document.getElementById('dBg').value,textColor:document.getElementById('dText').value,buttonColor:document.getElementById('dButton').value,buttonTextColor:document.getElementById('dButtonText').value,radius:+document.getElementById('dRadius').value,heroHeight:+document.getElementById('dHero').value,buttonText:document.getElementById('dButtonLabel').value};await save()}function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(m){const e=document.createElement('div');e.textContent=m;e.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:8px;z-index:99';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}let logoutPending=false;
async function logout(){
  if(logoutPending)return;
  const button=document.getElementById('logout-button');
  logoutPending=true;
  button.disabled=true;
  button.textContent='SIGNING OUT...';
  try{
    const response=await apiFetch('/api/admin/logout',{method:'POST'});
    if(!response.ok)throw new Error('logout failed');
    window.location.href='/admin/login';
  }catch(_){
    window.alert('ログアウトに失敗しました。時間をおいて再度お試しください。');
  }finally{
    logoutPending=false;
    button.disabled=false;
    button.textContent='LOGOUT';
  }
}
