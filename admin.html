/* Wi-Fi MEDIA night-operations theme */
:root {
  --night-bg: #111214;
  --night-panel: #24272c;
  --night-raised: #2b2f36;
  --night-edge: #3b414a;
  --night-edge-soft: #32373e;
  --night-text: #f1f3f6;
  --night-muted: #a6adb7;
  --neon-green: #b7ff56;
  --signal-cyan: #4ce5ff;
  --signal-purple: #B45CFF;
}
body {
  background-color: var(--night-bg);
  background-image:
    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--night-text);
}
.side {
  background: #191b20;
  border-right: 1px solid var(--night-edge);
  box-shadow: 4px 0 20px #0003;
}
.logo small, .nav { color: var(--night-muted); }
.nav { border-radius: 6px; transition: background .18s, color .18s, box-shadow .18s; }
.nav:hover, .nav.active {
  color: var(--night-text);
  background: #252a31;
  box-shadow: inset 2px 0 0 var(--signal-cyan), 0 0 10px #4ce5ff12;
}
.main { color: var(--night-text); }
.pagehead { border-bottom: 1px solid var(--night-edge-soft); }
.sub, .label, th, .legend, .previewbox { color: var(--night-muted); }
.card {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  box-shadow: 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}
.grid > .card {
  background: var(--night-raised);
  border-color: #414751;
}
.section { color: var(--night-text); border-bottom: 1px solid var(--night-edge-soft); }
.metric { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
.metric.connection, .metric.impression, .metric.coupon-view { color: var(--neon-green); text-shadow: 0 0 12px #b7ff5628; }
.metric.click, .metric.coupon-copy { color: var(--signal-cyan); text-shadow: 0 0 12px #4ce5ff28; }
.metric.ctr, .metric.coupon-redeem { color: var(--signal-purple); text-shadow: 0 0 12px rgba(180,92,255,.16); }
.metric.store, .metric.record, .metric.coupon-total { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
table { color: var(--night-text); }
th { color: #dce2e9; background: #1c1f24; border-bottom-color: var(--night-edge); }
td { color: #e5e8ed; border-bottom-color: var(--night-edge-soft); }
tbody tr:hover td { background: #30353d; }
.badge {
  color: #d6ff9d;
  background: #263621;
  border: 1px solid #52703a;
  border-radius: 5px;
  box-shadow: 0 0 8px #b7ff5610;
}
.off {
  color: #dfbdff;
  background: #2d2439;
  border-color: #60477a;
  box-shadow: 0 0 8px rgba(180,92,255,.06);
}
button {
  color: #eff5f7;
  background: #30353d;
  border: 1px solid #505862;
  border-radius: 6px;
  box-shadow: 0 2px 7px #0004;
  transition: border-color .16s, background .16s, box-shadow .16s, transform .16s;
}
button:hover {
  color: var(--night-text);
  background: #343d43;
  border-color: var(--signal-cyan);
  box-shadow: 0 0 9px #4ce5ff22;
}
button:active { transform: translateY(1px); }
button.secondary {
  color: #e0e5eb;
  background: #282c32;
  border-color: #424851;
  box-shadow: none;
}
button.secondary:hover { border-color: var(--neon-green); box-shadow: 0 0 8px #b7ff5618; }
input, textarea, select {
  color: var(--night-text);
  background: #1b1e23;
  border-color: #444a54;
  border-radius: 6px;
  color-scheme: dark;
}
input::placeholder, textarea::placeholder { color: #7f8791; }
input:focus, textarea:focus, select:focus {
  outline: 1px solid var(--signal-cyan);
  border-color: var(--signal-cyan);
  box-shadow: 0 0 8px #4ce5ff20;
}
.modalbg { background: #050608c9; backdrop-filter: blur(3px); }
.modal {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid #4a515b;
  border-radius: 10px;
  box-shadow: 0 12px 40px #0009, 0 0 18px #4ce5ff12;
}
.modal h2 { color: var(--night-text); }
.close { color: var(--night-text); background: #30353d; }
.close:hover { border-color: var(--signal-purple); box-shadow: 0 0 8px rgba(180,92,255,.11); }
.previewbox { color: var(--night-muted); background: #1d2025; border-color: #444a54; }
.phonewrap { background: #1b1e23; border: 1px solid var(--night-edge); border-radius: 8px; }
.phone { background: #0b0c0e; border-color: #070809; border-radius: 12px; }
.pie {
  background: conic-gradient(
    var(--neon-green) 0 var(--view-end),
    var(--signal-cyan) var(--view-end) var(--copy-end),
    var(--signal-purple) var(--copy-end) 100%
  );
  box-shadow: 0 0 12px #4ce5ff12;
}
.pie:after { background: var(--night-panel); }
.pie.is-empty { background: conic-gradient(#414751 0 100%); box-shadow: none; }
.pie-total {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  color: var(--night-text);
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.coupon-chart {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  align-items: center;
  gap: 20px;
  max-width: 500px;
  margin: 8px auto 22px;
  padding: 8px 14px;
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  background: #202329;
}
.coupon-legend { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.coupon-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 9px; color: var(--night-muted); font-size: 13px; }
.coupon-legend strong { color: var(--night-text); font-size: 14px; font-variant-numeric: tabular-nums; }
.coupon-swatch { width: 9px; height: 9px; border-radius: 2px; }
.coupon-swatch-view { background: var(--neon-green); box-shadow: 0 0 6px #b7ff5630; }
.coupon-swatch-copy { background: var(--signal-cyan); box-shadow: 0 0 6px #4ce5ff30; }
.coupon-swatch-redeem { background: var(--signal-purple); box-shadow: 0 0 6px rgba(180,92,255,.19); }
.legend { color: var(--night-muted); }
.comparison-meter {
  height: 4px;
  min-width: 42px;
  margin-top: 5px;
  overflow: hidden;
  background: #191c20;
  border: 1px solid #3a4149;
  border-radius: 2px;
}
.comparison-meter > span { display: block; width: var(--bar-width); height: 100%; }
.comparison-meter.impression > span {
  background: linear-gradient(90deg, #568d31, var(--neon-green));
  border-right: 1px solid #dcffb0;
  box-shadow: 0 0 6px #b7ff5638;
}
.comparison-meter.click > span {
  background: linear-gradient(90deg, #246b80, var(--signal-cyan));
  border-right: 1px solid #c1f8ff;
  box-shadow: 0 0 6px #4ce5ff38;
}
.card i[title^="表示"] {
  background-color: var(--neon-green) !important;
  box-shadow: 0 0 8px #b7ff5630;
}
.card i[title^="クリック"] {
  background-color: var(--signal-cyan) !important;
  box-shadow: 0 0 8px #4ce5ff30;
}
@media (max-width: 700px) {
  .side { border-right: 0; border-bottom: 1px solid var(--night-edge); box-shadow: 0 4px 16px #0003; }
  .coupon-chart { grid-template-columns: 1fr; justify-items: center; gap: 8px; padding: 14px; }
  .coupon-legend { width: min(100%, 280px); }
}

/* STEP A-2: subtle neon panel edges */
.card, .modal, .phonewrap {
  border-color: #3a4650;
  box-shadow:
    0 0 0 1px rgba(76, 229, 255, .045),
    0 6px 20px rgba(0, 0, 0, .28),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.grid > .card {
  border-color: #46504e;
  box-shadow:
    0 0 0 1px rgba(183, 255, 86, .035),
    0 6px 18px rgba(0, 0, 0, .3),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.previewbox {
  border-color: #3d4951;
  box-shadow: 0 0 10px rgba(76, 229, 255, .035);
}

/* STEP A-3: terminal identity labels */
.pagehead {
  position: relative;
  padding-top: 18px;
}
.pagehead::before {
  position: absolute;
  top: 0;
  left: 0;
  content: "SYSTEM STATUS";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  line-height: 1;
  text-shadow: 0 0 6px rgba(76, 229, 255, .3);
}
.logo small {
  font-size: 0;
  line-height: 1.5;
  letter-spacing: .16em;
}
.logo small::before {
  content: "CONTROL SYSTEM";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  text-shadow: 0 0 6px rgba(76, 229, 255, .24);
}

/* STEP A-4: terminal status badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #d6ff9d;
  background: #263621;
  border-color: #52703a;
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(183, 255, 86, .08);
  letter-spacing: .04em;
}
.badge::before {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  content: "";
  background: var(--neon-green);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(183, 255, 86, .55);
}
.badge.off {
  color: #a4abb4;
  background: #22262b;
  border-color: #41474f;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}
.badge.off::before {
  background: #727a84;
  box-shadow: none;
}

/* STEP B-1: terminal bar chart */
.card div[style*="min-height:170px"] {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    rgba(166, 186, 198, .09) 31px,
    rgba(166, 186, 198, .09) 32px
  );
  background-size: 100% 32px;
  border-bottom: 1px solid rgba(166, 186, 198, .16);
}
.card i[title^="表示"] {
  background-color: #88e943 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(15, 30, 8, .18) 5px 6px),
    linear-gradient(0deg, #538a2e 0%, #b7ff56 100%) !important;
  border: 1px solid rgba(211, 255, 163, .52);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(183, 255, 86, .2);
}
.card i[title^="クリック"] {
  background-color: #39cce5 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(4, 20, 28, .18) 5px 6px),
    linear-gradient(0deg, #246b80 0%, #4ce5ff 100%) !important;
  border: 1px solid rgba(157, 243, 255, .5);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(76, 229, 255, .2);
}

/* STEP D-1A: restrained CRT treatment, dashboard only */
.dashboard-view {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(205, 245, 255, .018) 0,
    rgba(205, 245, 255, .018) 1px,
    transparent 1px,
    transparent 4px
  );
}
.dashboard-view .metric.connection {
  text-shadow: 0 0 2px rgba(183, 255, 86, .68), 0 0 7px rgba(183, 255, 86, .3), 0 0 14px rgba(183, 255, 86, .12);
}
.dashboard-view .metric.click {
  text-shadow: 0 0 2px rgba(76, 229, 255, .68), 0 0 7px rgba(76, 229, 255, .3), 0 0 14px rgba(76, 229, 255, .12);
}
.dashboard-view .metric.ctr {
  text-shadow: 0 0 2px rgba(180,92,255,.62), 0 0 7px rgba(180,92,255,.28), 0 0 14px rgba(180,92,255,.1);
}
.dashboard-view .dashboard-connection-card { --dashboard-accent: rgba(183, 255, 86, .34); }
.dashboard-view .dashboard-click-card { --dashboard-accent: rgba(76, 229, 255, .34); }
.dashboard-view .dashboard-ctr-card { --dashboard-accent: rgba(180,92,255,.3); }
.dashboard-view .dashboard-metric-card {
  border-top-color: var(--dashboard-accent);
  box-shadow: inset 0 1px 0 var(--dashboard-accent), 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}

.logo {
  text-shadow: 0 0 3px rgba(76, 229, 255, .42), 0 0 9px rgba(76, 229, 255, .18);
}
.nav.active {
  background: linear-gradient(90deg, rgba(183, 255, 86, .1), rgba(76, 229, 255, .09) 48%, #252a31);
  box-shadow: inset 2px 0 0 var(--neon-green), inset 0 0 0 1px rgba(76, 229, 255, .16), 0 0 10px rgba(76, 229, 255, .1);
}
/* STEP D-1B: dashboard CRT console treatment */
.dashboard-view {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(205, 245, 255, .026) 0,
    rgba(205, 245, 255, .026) 1px,
    transparent 1px,
    transparent 4px
  );
}
.dashboard-title {
  display: block;
  color: #9fffa6;
  font-family: "Orbitron", "IBM Plex Sans JP", sans-serif;
  font-size: clamp(34px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: .015em;
  line-height: 1.04;
  text-shadow: 0 0 3px rgba(183, 255, 86, .65), 0 0 10px rgba(76, 229, 255, .4), 0 0 22px rgba(76, 229, 255, .18);
}
.dashboard-title-ja {
  display: block;
  margin-top: 5px;
  color: var(--night-muted);
  font-family: "IBM Plex Sans JP", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  line-height: 1.5;
}
.dashboard-system-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: -2px 0 16px;
  padding: 9px 12px;
  background: linear-gradient(90deg, rgba(20, 33, 35, .82), rgba(17, 20, 22, .72));
  border: 1px solid rgba(76, 229, 255, .2);
  border-left: 2px solid rgba(76, 229, 255, .52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.dashboard-console-name { color: #c8f9ff; font-size: 11px; letter-spacing: .07em; }
.dashboard-console-message { margin-top: 3px; color: #98a7a9; font-size: 10px; }
.dashboard-online, .dashboard-connected {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #c7ff94;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  white-space: nowrap;
}
.dashboard-online i, .dashboard-connected i {
  width: 6px;
  height: 6px;
  display: inline-block;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 5px rgba(183, 255, 86, .65), 0 0 10px rgba(183, 255, 86, .25);
}
.dashboard-view .dashboard-metric-card {
  --dashboard-edge: rgba(76, 229, 255, .25);
  position: relative;
  overflow: hidden;
  color: var(--night-text);
  background-color: #15181b;
  background-image:
    repeating-linear-gradient(to bottom, rgba(205, 245, 255, .035) 0 1px, transparent 1px 4px),
    linear-gradient(rgba(76, 229, 255, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(76, 229, 255, .028) 1px, transparent 1px);
  background-size: 100% 4px, 22px 22px, 22px 22px;
  border: 1px solid var(--dashboard-edge);
  border-top-color: rgba(76, 229, 255, .48);
  box-shadow: inset 0 1px 0 rgba(157, 243, 255, .06), 0 5px 16px rgba(0, 0, 0, .36), 0 0 8px rgba(76, 229, 255, .045);
}
.dashboard-view .dashboard-store-card { --dashboard-edge: rgba(183, 255, 86, .2); border-top-color: rgba(183, 255, 86, .42); }
.dashboard-view .dashboard-connection-card { --dashboard-edge: rgba(183, 255, 86, .26); border-top-color: rgba(183, 255, 86, .58); }
.dashboard-view .dashboard-click-card { --dashboard-edge: rgba(76, 229, 255, .28); border-top-color: rgba(76, 229, 255, .58); }
.dashboard-view .dashboard-ctr-card { --dashboard-edge: rgba(180,92,255,.22); border-top-color: rgba(180,92,255,.48); }
.dashboard-view .metric.connection {
  text-shadow: 0 0 2px rgba(183, 255, 86, .78), 0 0 7px rgba(183, 255, 86, .46), 0 0 16px rgba(183, 255, 86, .24), 0 0 25px rgba(183, 255, 86, .1);
}
.dashboard-view .metric.click {
  text-shadow: 0 0 2px rgba(76, 229, 255, .78), 0 0 7px rgba(76, 229, 255, .46), 0 0 16px rgba(76, 229, 255, .24), 0 0 25px rgba(76, 229, 255, .1);
}
.dashboard-view .metric.ctr {
  text-shadow: 0 0 2px rgba(180,92,255,.68), 0 0 7px rgba(180,92,255,.38), 0 0 16px rgba(180,92,255,.18);
}
.dashboard-view .dashboard-delivery-section {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
.dashboard-terminal-label {
  display: block;
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: .16em;
  line-height: 1.4;
  text-shadow: 0 0 5px rgba(76, 229, 255, .24);

/* STEP D-4C: restrained CRT scanlines and rings on the coupon pie only */
.analytics-view .analytics-coupon-chart .pie::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 1px solid rgba(132,239,246,.44);
  border-radius: 50%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(205,249,255,.1) 0,
    rgba(205,249,255,.1) 1px,
    transparent 1px,
    transparent 4px
  );
  opacity: .38;
  box-shadow:
    inset 0 0 0 2px rgba(5,12,15,.55),
    inset 0 0 0 3px rgba(183,255,86,.28);
  pointer-events: none;
}
.analytics-view .analytics-coupon-chart .pie::after {
  z-index: 2;
  border: 1px solid rgba(76,229,255,.28);
  box-shadow: inset 0 0 0 1px rgba(76,229,255,.055), 0 0 5px rgba(76,229,255,.08);
}
.analytics-view .analytics-coupon-chart .pie-total {
  z-index: 3;
}

function secureAdCreateKey(){
  const cryptoApi=window.crypto;
  try{
    if(typeof cryptoApi?.randomUUID==='function')return cryptoApi.randomUUID();
    if(typeof cryptoApi?.getRandomValues==='function'){
      const bytes=cryptoApi.getRandomValues(new Uint8Array(16));
      return Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('');
    }
  }catch(_){return null;}
  return null;
}

function displayCampaignDate(value){
  if(typeof value!=='string'||!(/^\d{4}-\d{2}-\d{2}$/).test(value))return '日付不明';

}
function tokyoTodayIso(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const values=Object.fromEntries(parts.filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}
function isValidCampaignDate(value){
  if(typeof value!=='string'||!(/^\d{4}-\d{2}-\d{2}$/).test(value))return false;
  const [year,month,day]=value.split('-').map(Number);
  if(year<1)return false;
  const parsed=new Date(Date.UTC(year,month-1,day));
  return parsed.getUTCFullYear()===year&&parsed.getUTCMonth()===month-1&&parsed.getUTCDate()===day;
}
function campaignLifecycleStatus(campaign){
  const status=campaign?.status;
  if(status==='draft')return {status,label:'下書き',className:'is-draft'};
  if(status==='active')return {status,label:'公開中',className:'is-active'};
  if(status==='paused')return {status,label:'停止中',className:'is-paused'};
  if(status==='archived')return {status,label:'アーカイブ済み',className:'is-archived'};
  return {status:null,label:'状態不明',className:'is-unknown'};
}
function defaultAdStatus(ad=S.ad){

function campaignPeriodNote(campaign,today=tokyoTodayIso()){
  const startsOn=campaign?.startsOn??campaign?.start??null,endsOn=campaign?.endsOn??campaign?.end??null;
  if((startsOn!==null&&startsOn!==undefined&&!isValidCampaignDate(startsOn))||(endsOn!==null&&endsOn!==undefined&&!isValidCampaignDate(endsOn))||!isValidCampaignDate(today))return '期間エラー';
  if(startsOn&&endsOn&&startsOn>endsOn)return '期間エラー';
  if(startsOn&&startsOn>today)return '掲載開始前';
  if(endsOn&&endsOn<today)return '掲載期間終了';
  return '';
}

function clearAdLocalPreviewUrls(){

function setAdLocalPreviewImage(slot,file){

  const allowedTypes=new Set(['image/gif','image/png','image/jpeg','image/webp']);

function updateAdEditorPreview(){
  const titleInput=document.getElementById('aTitle');
  const bodyInput=document.getElementById('aBody');
  if(!titleInput||!bodyInput)return;
  const title=titleInput.value.trim()||'広告タイトル';
  const body=bodyInput.value.trim()||'広告本文がここに表示されます。';
  const start=document.getElementById('aStart')?.value||'';
  const end=document.getElementById('aEnd')?.value||'';
  const link=document.getElementById('aLink')?.value.trim()||'';
  const savedPcImage=adTarget==='global'?(typeof S?.ad?.media==='string'?S.ad.media:''):(adCreatingNew?'':(adCampaign?.mediaUrl||''));
  const savedMobileImage=adTarget==='global'?(typeof S?.ad?.mediaMobile==='string'?S.ad.mediaMobile:''):(adCreatingNew?'':(adCampaign?.mediaUrlMobile||''));
  const safeImageUrl=value=>{
    if(typeof value!=='string'||!value.trim())return '';
    if(value===adLocalPreviewUrls.pc||value===adLocalPreviewUrls.mobile)return value;
    try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)?url.href:'';}catch(_){return '';}
  };
  const safeLink=()=>{
    if(!link)return false;
    try{return ['http:','https:'].includes(new URL(link,location.origin).protocol);}catch(_){return false;}
  };
  const linkReady=safeLink();
  const periodValue=start||end?`掲載期間：${start||'指定なし'} 〜 ${end||'指定なし'}`:'掲載期間：未設定';
  const pcImage=adLocalPreviewUrls.pc||savedPcImage;
  const mobileImage=adLocalPreviewUrls.mobile||adLocalPreviewUrls.pc||savedMobileImage||savedPcImage;
  const previewValues=[
    {prefix:'adEditorPc',image:pcImage},
    {prefix:'adEditorMobile',image:mobileImage},
  ];
  for(const preview of previewValues){
    const titleNode=document.getElementById(`${preview.prefix}Title`);
    const bodyNode=document.getElementById(`${preview.prefix}Body`);
    const periodNode=document.getElementById(`${preview.prefix}Period`);
    const linkNode=document.getElementById(`${preview.prefix}LinkState`);
    const ctaNode=document.getElementById(`${preview.prefix}Cta`);
    const imageNode=document.getElementById(`${preview.prefix}Image`);
    const placeholder=document.getElementById(`${preview.prefix}ImagePlaceholder`);
    if(!titleNode||!bodyNode||!periodNode||!linkNode||!ctaNode||!imageNode||!placeholder)continue;
    titleNode.textContent=title;
    bodyNode.textContent=body;
    periodNode.textContent=periodValue;
    linkNode.textContent=linkReady?'リンク設定あり':'リンク未設定';
    ctaNode.classList.toggle('is-unlinked',!linkReady);
    ctaNode.setAttribute('aria-label',linkReady?'詳しく見る（プレビュー専用・操作不可）':'詳しく見る（リンク未設定・操作不可）');
    const imageUrl=safeImageUrl(preview.image);
    imageNode.dataset.previewSrc=imageUrl;
    imageNode.onerror=()=>{
      if(imageNode.dataset.previewSrc!==imageUrl)return;
      imageNode.hidden=true;placeholder.textContent='画像を表示できません';placeholder.hidden=false;
    };
    if(imageUrl){placeholder.textContent='画像を読み込んでいます…';imageNode.src=imageUrl;imageNode.hidden=false;placeholder.hidden=true;}
    else{imageNode.removeAttribute('src');imageNode.hidden=true;placeholder.textContent='画像未設定';placeholder.hidden=false;}
  }
}

function campaignStatusErrorMessage(status,errorCode=''){

  if(status===404)return '広告が見つかりません。広告一覧を再読み込みしてください。';

  if(status>=500)return 'サーバーで処理できませんでした。時間をおいて再度ご確認ください。';

}

async function changeCampaignStatus(campaignId,nextStatus){

  if(!campaign)return;

  if(!isDefault&&(adTarget!=='store'||String(selectedCampaignId)!==String(campaignId)))return;

async function saveStoreCompany(storeId){
  const key=String(storeId);
  if(isArchivedStore(companyAdminData.stores.find(store=>String(store.id)===key)))return;
  if(companyAssignSaving.has(key))return;
  const select=document.querySelector(`[data-company-select="${CSS.escape(key)}"]`);
  if(!select)return;
  const selectedValue=select.value;
  const companyId=selectedValue===''?null:selectedValue;
  companyAssignSaving.add(key);companyStoreNotices[key]='';
  select.disabled=true;
  const button=document.querySelector(`[data-company-assign="${CSS.escape(key)}"]`);
  if(button){button.disabled=true;button.textContent='保存中…';}
  try{
    const response=await companyApiFetch(`/api/admin/stores/${encodeURIComponent(key)}/company`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({companyId})});
    if(!response.ok)throw new Error(String(response.status));
    try{
      await refreshCompanyAdminData();
      companyStoreNotices[key]='企業所属を更新しました';
    }catch(_){
      const store=companyAdminData.stores.find(item=>String(item.id)===key);
      if(store)store.companyId=companyId;
      companyStoreNotices[key]='所属は更新されましたが一覧を更新できませんでした。再読み込みしてください。';
    }
  }catch(error){
    companyStoreNotices[key]=companyApiError(error,'企業所属を更新できませんでした');
    try{await refreshCompanyAdminData();}catch(_){}
  }finally{
    companyAssignSaving.delete(key);
    if(location.hash==='#companies')renderCompanyManagement();
  }
}

function analyticsComparisonData(currentTrend,previousTrend){
  const normalize=trend=>Array.isArray(trend?.points)?trend.points.map(point=>{const safeCount=value=>{const count=Number(value);return Number.isFinite(count)?Math.max(0,count):0;};return {label:String(point?.label??''),impressions:safeCount(point?.impressions),clicks:safeCount(point?.clicks)};}):[];
  const current=normalize(currentTrend),previous=normalize(previousTrend);
  const sums=points=>points.reduce((totals,point)=>({impressions:totals.impressions+point.impressions,clicks:totals.clicks+point.clicks}),{impressions:0,clicks:0});
  const currentTotals=sums(current),previousTotals=sums(previous);
  const ctr=totals=>totals.impressions>0?totals.clicks/totals.impressions*100:null;
  return {current,previous,currentTotals,previousTotals,currentCtr:ctr(currentTotals)??0,previousCtr:ctr(previousTotals)};
}
function analyticsPeriodComparisonMarkup(currentTrend,previousTrend){
  const comparison=analyticsComparisonData(currentTrend,previousTrend);
  if(!Array.isArray(currentTrend?.points)||!Array.isArray(previousTrend?.points))return '<div class="analytics-trend-empty" role="status">期間比較データを読み込めませんでした。</div>';
  const names={yesterday:'一昨日と比較', '7d':'前の7日間と比較', '30d':'前の30日間と比較', '12m':'前の12ヶ月と比較'};
  const formatCount=value=>Math.round(value).toLocaleString();
  const percentDelta=(current,previous)=>{
    if(previous===0)return current>0?{text:'NEW',kind:'is-up'}:{text:'—',kind:'is-unavailable'};
    const delta=(current-previous)/previous*100;
    if(!Number.isFinite(delta))return {text:'—',kind:'is-unavailable'};
    if(Math.abs(delta)<0.05)return {text:'→ 0%',kind:'is-flat'};
    return {text:`${delta>0?'↑ +':'↓ '}${delta.toFixed(1)}%`,kind:delta>0?'is-up':'is-down'};
  };
  const pointDelta=(current,previous)=>{
    if(current===null||previous===null)return {text:'比較不可',kind:'is-unavailable'};
    const delta=current-previous;
    if(Math.abs(delta)<0.005)return {text:'→ 0.00pt',kind:'is-flat'};
    return {text:`${delta>0?'↑ +':'↓ -'}${Math.abs(delta).toFixed(2)}pt`,kind:delta>0?'is-up':'is-down'};
  };
  const ctrText=value=>value===null?'—':`${value.toFixed(2)}%`;
  const cards=[
    {label:'表示回数',current:formatCount(comparison.currentTotals.impressions),previous:formatCount(comparison.previousTotals.impressions),delta:percentDelta(comparison.currentTotals.impressions,comparison.previousTotals.impressions),previousLabel:'過去期間'},
    {label:'クリック',current:formatCount(comparison.currentTotals.clicks),previous:formatCount(comparison.previousTotals.clicks),delta:percentDelta(comparison.currentTotals.clicks,comparison.previousTotals.clicks),previousLabel:'過去期間'},
    {label:'CTR',current:ctrText(comparison.currentCtr),previous:ctrText(comparison.previousCtr),delta:pointDelta(comparison.currentCtr,comparison.previousCtr),previousLabel:'過去期間'},
  ];

  return `<div class="analytics-period-comparison"><div class="analytics-period-comparison-heading"><span class="terminal-label">PERIOD COMPARISON</span><span class="comparison-period-name">${names[period]||'直前期間と比較'}</span></div><div class="analytics-period-comparison-cards">${cards.map(card=>`<article class="analytics-period-comparison-card"><div class="comparison-label">${card.label}</div><div class="comparison-current-row"><strong class="comparison-current">${card.current}</strong><span class="comparison-delta ${card.delta.kind}">${card.delta.text}</span></div><div class="comparison-previous">${card.previousLabel} ${card.previous}</div></article>`).join('')}</div>${note?`<div class="analytics-period-comparison-note">${note}</div>`:''}</div>`;
}
function analyticsTrendChartMarkup(trend,previousTrend){
  const comparison=analyticsComparisonData(trend,previousTrend);
  const points=comparison.current,previousPoints=comparison.previous;
  if(!points.length)return '<div class="analytics-trend-empty" role="status">この期間の推移データを読み込めませんでした。</div>';
  const width=960,height=330,left=66,right=62,top=28,bottom=54,plotWidth=width-left-right,plotHeight=height-top-bottom;
  const maxImpressions=Math.max(1,...points.map(point=>point.impressions),...previousPoints.map(point=>point.impressions));
  const maxClicks=Math.max(1,...points.map(point=>point.clicks),...previousPoints.map(point=>point.clicks));
  const xAt=index=>points.length===1?left+plotWidth/2:left+(plotWidth*index/(points.length-1));
  const yAt=(value,max)=>top+plotHeight-(value/max)*plotHeight;
  const makePath=(series,key,max)=>series.map((point,index)=>`${index?'L':'M'}${xAt(index).toFixed(1)},${yAt(point[key],max).toFixed(1)}`).join(' ');
  const previousImpressionPath=makePath(previousPoints,'impressions',maxImpressions);
  const previousClickPath=makePath(previousPoints,'clicks',maxClicks);
  const impressionPath=makePath(points,'impressions',maxImpressions);
  const clickPath=makePath(points,'clicks',maxClicks);
  const grid=Array.from({length:5},(_,index)=>{
    const ratio=index/4,y=top+plotHeight*(1-ratio);
    const impressionValue=Math.round(maxImpressions*ratio),clickValue=Math.round(maxClicks*ratio);
    return `<g><line class="trend-grid" x1="${left}" y1="${y}" x2="${width-right}" y2="${y}"/><text x="${left-9}" y="${y+4}" text-anchor="end">${impressionValue.toLocaleString()}</text><text x="${width-right+9}" y="${y+4}" text-anchor="start">${clickValue.toLocaleString()}</text></g>`;
  }).join('');
  const period=String(trend?.period||'');
  const labelIndexes=points.map((_,index)=>index).filter(index=>{
    if(period==='30d')return index%5===0||index===points.length-1;
    return true;
  });
  const labels=labelIndexes.map(index=>`<text x="${xAt(index)}" y="${height-20}" text-anchor="middle">${esc(points[index].label)}</text>`).join('');
  const previousDots=previousPoints.map((point,index)=>`<g><circle class="trend-point-previous" cx="${xAt(index)}" cy="${yAt(point.impressions,maxImpressions)}" r="2.2"><title>過去期間 ${esc(point.label)}：表示回数 ${point.impressions.toLocaleString()}</title></circle><circle class="trend-point-previous" cx="${xAt(index)}" cy="${yAt(point.clicks,maxClicks)}" r="2.2"><title>過去期間 ${esc(point.label)}：クリック ${point.clicks.toLocaleString()}</title></circle></g>`).join('');
  const impressionDots=points.map((point,index)=>`<circle class="trend-point-impressions" cx="${xAt(index)}" cy="${yAt(point.impressions,maxImpressions)}" r="3"><title>${esc(point.label)}：表示回数 ${point.impressions.toLocaleString()}</title></circle>`).join('');
  const clickDots=points.map((point,index)=>`<circle class="trend-point-clicks" cx="${xAt(index)}" cy="${yAt(point.clicks,maxClicks)}" r="3"><title>${esc(point.label)}：クリック ${point.clicks.toLocaleString()}</title></circle>`).join('');
  const allZero=points.every(point=>point.impressions===0&&point.clicks===0);
  const previousAllZero=previousPoints.every(point=>point.impressions===0&&point.clicks===0);
  return `<div class="analytics-trend-chart-wrap"><svg class="analytics-trend-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="現在期間と過去期間の表示回数・クリック推移。過去期間は灰色の線です。左軸は表示回数、右軸はクリックです。">${grid}<line class="trend-axis" x1="${left}" y1="${top}" x2="${left}" y2="${top+plotHeight}"/><line class="trend-axis" x1="${width-right}" y1="${top}" x2="${width-right}" y2="${top+plotHeight}"/><text class="trend-axis-title" transform="translate(18 ${top+plotHeight/2}) rotate(-90)" text-anchor="middle">表示回数</text><text class="trend-axis-title" transform="translate(${width-14} ${top+plotHeight/2}) rotate(-90)" text-anchor="middle">クリック</text>${previousPoints.length?`<path class="trend-previous-impressions" d="${previousImpressionPath}"/><path class="trend-previous-clicks" d="${previousClickPath}"/>${previousDots}`:''}<path class="trend-impressions" d="${impressionPath}"/><path class="trend-clicks" d="${clickPath}"/>${impressionDots}${clickDots}${labels}${allZero&&previousAllZero?`<text class="trend-zero" x="${left+plotWidth/2}" y="${top+plotHeight/2}" text-anchor="middle">この期間の実測データはまだありません</text>`:''}</svg></div>`;
}

async function fetchAnalyticsScope(companyId,period){

function analyticsStoreRankingRowsMarkup(details){
  const byId=new Map();
  const safeCount=value=>{const count=Number(value);return Number.isFinite(count)?Math.max(0,Math.floor(count)):0;};
  (Array.isArray(details)?details:[]).forEach(item=>{
    const storeId=String(item?.storeId??'').trim();
    if(!storeId)return;
    const impressions=safeCount(item?.impressions),clicks=safeCount(item?.clicks);
    const existing=byId.get(storeId);
    if(existing){
      existing.impressions+=impressions;
      existing.clicks+=clicks;
      const name=String(item?.storeName||'未設定');
      if(name<existing.storeName)existing.storeName=name;
    }else{
      byId.set(storeId,{storeId,storeName:String(item?.storeName||'未設定'),impressions,clicks});
    }
  });
  const rows=Array.from(byId.values()).map(item=>({...item,ctr:item.impressions?item.clicks/item.impressions*100:0}));
  rows.sort((a,b)=>b.clicks-a.clicks||b.impressions-a.impressions||b.ctr-a.ctr||

    (a.storeId<b.storeId?-1:a.storeId>b.storeId?1:0));
  const maxImpressions=rows.reduce((max,item)=>Math.max(max,item.impressions),0);
  const maxClicks=rows.reduce((max,item)=>Math.max(max,item.clicks),0);

  return rows.length?rows.map((item,index)=>`<tr class="analytics-store-ranking-row${index===0?' is-top':''}"><td><span class="analytics-store-rank${index===0?' is-top':''}">${index+1}</span></td><td><span class="store-ranking-name" title="${esc(item.storeName)}">${esc(item.storeName)}</span></td><td><div>${item.impressions.toLocaleString()}</div>${meter(item.impressions,maxImpressions,'impression')}</td><td><div>${item.clicks.toLocaleString()}</div>${meter(item.clicks,maxClicks,'click')}</td><td>${item.ctr.toFixed(2)}%</td></tr>`).join(''):'<tr><td colspan="5" class="analytics-store-ranking-empty">この期間の店舗実績はありません。</td></tr>';

function setDesignSaveError(message){designSaveError=message;const error=document.getElementById('designSaveError');if(error){error.textContent=message;error.hidden=!message}}function clearDesignSaveError(){if(designSaveError)setDesignSaveError('')}function design(){designSaveError='';shell('<span class="web-design-title">WEB DESIGN</span><span class="web-design-title-ja">Webデザイン</span>','公開ページ全体の色・角丸・高さ・見出し・ボタンを変更できます.',`<div class="web-design-view"><div class="web-design-system-status"><div><div class="web-design-console-name">WEB APPEARANCE CONTROL</div><div class="web-design-console-message">Editing public Wi-Fi interface configuration.</div></div><span class="web-design-live"><i></i> LIVE PREVIEW</span></div><div class="layout web-design-layout"><section class="card web-design-panel web-design-config-panel"><div class="web-design-panel-heading"><span class="web-design-terminal-label">INTERFACE CONFIGURATION</span><div class="section">デザイン設定</div></div><div class="field"><label>ブランド名</label><input id="dBrand" value="${esc(S.design.brand)}"></div><div class="field"><label>ページ見出し</label><input id="dTitle" value="${esc(S.design.pageTitle)}"></div><div class="twocol"><div class="field"><label>背景色</label><input id="dBg" type="color" value="${S.design.background}"></div><div class="field"><label>文字色</label><input id="dText" type="color" value="${S.design.textColor}"></div></div><div class="twocol"><div class="field"><label>ボタン色</label><input id="dButton" type="color" value="${S.design.buttonColor}"></div><div class="field"><label>ボタン文字色</label><input id="dButtonText" type="color" value="${S.design.buttonTextColor}"></div></div><div class="twocol"><div class="field"><label>角丸</label><input id="dRadius" type="number" value="${S.design.radius}"></div><div class="field"><label>メインビジュアル高さ</label><input id="dHero" type="number" value="${S.design.heroHeight}"></div></div><div class="field"><label>ボタン文言</label><input id="dButtonLabel" value="${esc(S.design.buttonText)}"></div><p id="designSaveError" class="form-save-error" role="alert" hidden></p><div class="actions web-design-actions"><button class="web-design-primary" onclick="saveDesign()">デザインを保存</button><button class="secondary web-design-secondary" onclick="window.open('/','_blank')">公開ページを見る</button></div></section><section class="card web-design-panel web-design-preview-panel"><div class="web-design-preview-head"><div><span class="web-design-terminal-label">LIVE WEB PREVIEW</span><div class="section">リアルタイム確認</div></div><span class="web-design-connected"><i></i> CONNECTED</span></div><div class="phonewrap web-design-crt-frame"><div class="phone web-design-phone"><iframe src="/?preview=1" title="preview"></iframe></div></div><div class="web-design-preview-footer"><span>PREVIEW MODE : LIVE</span><span class="web-design-signal"><i></i><i></i><i></i></span></div></section></div></div>`);document.querySelector('.web-design-config-panel')?.addEventListener('input',clearDesignSaveError)}async function saveDesign(){clearDesignSaveError();const savedDesign=S.design;S.design={...S.design,brand:document.getElementById('dBrand').value,pageTitle:document.getElementById('dTitle').value,background:document.getElementById('dBg').value,textColor:document.getElementById('dText').value,buttonColor:document.getElementById('dButton').value,buttonTextColor:document.getElementById('dButtonText').value,radius:+document.getElementById('dRadius').value,heroHeight:+document.getElementById('dHero').value,buttonText:document.getElementById('dButtonLabel').value};const saved=await save({preserveFormOnFailure:true,onFailure:setDesignSaveError});if(!saved)S.design=savedDesign}function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').style.display='flex'}function storeEditFormValues(){return ['sName','sCompanyId','sType','sWifi','sUsers','sStatus'].map(id=>document.getElementById(id)?.value??null)}function hasUnsavedStoreEditChanges(){return Boolean(document.getElementById('storeEditForm')&&storeEditInitialValues&&JSON.stringify(storeEditFormValues())!==JSON.stringify(storeEditInitialValues))}function closeModal(force=false){if(!force&&hasUnsavedStoreEditChanges()&&!confirm('変更内容は保存されていません。閉じてもよいですか？'))return false;document.getElementById('modal').style.display='none';storeEditInitialValues=null;return true}document.getElementById('modal').addEventListener('click',event=>{if(event.target===event.currentTarget&&document.getElementById('storeEditForm'))closeModal()});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(message,{type='success',duration}={}){const validType=['success','error','info'].includes(type)?type:'info';const defaultDurations={success:3000,error:5000,info:2000};const visibleFor=Number.isFinite(duration)?Math.max(0,duration):defaultDurations[validType];let region=document.getElementById('adminToastRegion');if(!region){region=document.createElement('div');region.id='adminToastRegion';region.className='admin-toast-region';region.setAttribute('role','region');region.setAttribute('aria-label','通知');document.body.appendChild(region)}const item=document.createElement('div');item.className=`admin-toast admin-toast-${validType}`;item.setAttribute('role',validType==='error'?'alert':'status');item.setAttribute('aria-live',validType==='error'?'assertive':'polite');item.textContent=String(message??'');region.appendChild(item);while(region.children.length>4){const oldest=region.firstElementChild;if(oldest?._toastTimer)clearTimeout(oldest._toastTimer);oldest?.remove()}item._toastTimer=setTimeout(()=>{item.remove();if(!region.children.length)region.remove()},visibleFor)}let logoutPending=false;
async function logout(){
  if(logoutPending)return;
  const button=document.getElementById('logout-button');
  logoutPending=true;
  button.disabled=true;
  button.textContent='SIGNING OUT...';
  try{
    const response=await apiFetch('/api/admin/logout',{method:'POST'});
    if(!response.ok)throw new Error('logout failed');
    window.location.href='/admin/login';
  }catch(_){
    window.alert('ログアウトに失敗しました。時間をおいて再度お試しください。');
  }finally{
    logoutPending=false;
    button.disabled=false;
    button.textContent='LOGOUT';
  }
}
