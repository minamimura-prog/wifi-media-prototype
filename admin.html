/* Wi-Fi MEDIA night-operations theme */
:root {
  --night-bg: #111214;
  --night-panel: #24272c;
  --night-raised: #2b2f36;
  --night-edge: #3b414a;
  --night-edge-soft: #32373e;
  --night-text: #f1f3f6;
  --night-muted: #a6adb7;
  --neon-green: #b7ff56;
  --signal-cyan: #4ce5ff;
  --signal-purple: #B45CFF;
}
body {
  background-color: var(--night-bg);
  background-image:
    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--night-text);
}
.side {
  background: #191b20;
  border-right: 1px solid var(--night-edge);
  box-shadow: 4px 0 20px #0003;
}
.logo small, .nav { color: var(--night-muted); }
.nav { border-radius: 6px; transition: background .18s, color .18s, box-shadow .18s; }
.nav:hover, .nav.active {
  color: var(--night-text);
  background: #252a31;
  box-shadow: inset 2px 0 0 var(--signal-cyan), 0 0 10px #4ce5ff12;
}
.main { color: var(--night-text); }
.pagehead { border-bottom: 1px solid var(--night-edge-soft); }
.sub, .label, th, .legend, .previewbox { color: var(--night-muted); }
.card {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  box-shadow: 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}
.grid > .card {
  background: var(--night-raised);
  border-color: #414751;
}
.section { color: var(--night-text); border-bottom: 1px solid var(--night-edge-soft); }
.metric { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
.metric.connection, .metric.impression, .metric.coupon-view { color: var(--neon-green); text-shadow: 0 0 12px #b7ff5628; }
.metric.click, .metric.coupon-copy { color: var(--signal-cyan); text-shadow: 0 0 12px #4ce5ff28; }
.metric.ctr, .metric.coupon-redeem { color: var(--signal-purple); text-shadow: 0 0 12px rgba(180,92,255,.16); }
.metric.store, .metric.record, .metric.coupon-total { color: var(--night-text); text-shadow: 0 0 12px #ffffff12; }
table { color: var(--night-text); }
th { color: #dce2e9; background: #1c1f24; border-bottom-color: var(--night-edge); }
td { color: #e5e8ed; border-bottom-color: var(--night-edge-soft); }
tbody tr:hover td { background: #30353d; }
.badge {
  color: #d6ff9d;
  background: #263621;
  border: 1px solid #52703a;
  border-radius: 5px;
  box-shadow: 0 0 8px #b7ff5610;
}
.off {
  color: #dfbdff;
  background: #2d2439;
  border-color: #60477a;
  box-shadow: 0 0 8px rgba(180,92,255,.06);
}
button {
  color: #eff5f7;
  background: #30353d;
  border: 1px solid #505862;
  border-radius: 6px;
  box-shadow: 0 2px 7px #0004;
  transition: border-color .16s, background .16s, box-shadow .16s, transform .16s;
}
button:hover {
  color: var(--night-text);
  background: #343d43;
  border-color: var(--signal-cyan);
  box-shadow: 0 0 9px #4ce5ff22;
}
button:active { transform: translateY(1px); }
button.secondary {
  color: #e0e5eb;
  background: #282c32;
  border-color: #424851;
  box-shadow: none;
}
button.secondary:hover { border-color: var(--neon-green); box-shadow: 0 0 8px #b7ff5618; }
input, textarea, select {
  color: var(--night-text);
  background: #1b1e23;
  border-color: #444a54;
  border-radius: 6px;
  color-scheme: dark;
}
input::placeholder, textarea::placeholder { color: #7f8791; }
input:focus, textarea:focus, select:focus {
  outline: 1px solid var(--signal-cyan);
  border-color: var(--signal-cyan);
  box-shadow: 0 0 8px #4ce5ff20;
}
.modalbg { background: #050608c9; backdrop-filter: blur(3px); }
.modal {
  color: var(--night-text);
  background: var(--night-panel);
  border: 1px solid #4a515b;
  border-radius: 10px;
  box-shadow: 0 12px 40px #0009, 0 0 18px #4ce5ff12;
}
.modal h2 { color: var(--night-text); }
.close { color: var(--night-text); background: #30353d; }
.close:hover { border-color: var(--signal-purple); box-shadow: 0 0 8px rgba(180,92,255,.11); }
.previewbox { color: var(--night-muted); background: #1d2025; border-color: #444a54; }
.phonewrap { background: #1b1e23; border: 1px solid var(--night-edge); border-radius: 8px; }
.phone { background: #0b0c0e; border-color: #070809; border-radius: 12px; }
.pie {
  background: conic-gradient(
    var(--neon-green) 0 var(--view-end),
    var(--signal-cyan) var(--view-end) var(--copy-end),
    var(--signal-purple) var(--copy-end) 100%
  );
  box-shadow: 0 0 12px #4ce5ff12;
}
.pie:after { background: var(--night-panel); }
.pie.is-empty { background: conic-gradient(#414751 0 100%); box-shadow: none; }
.pie-total {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  color: var(--night-text);
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.coupon-chart {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  align-items: center;
  gap: 20px;
  max-width: 500px;
  margin: 8px auto 22px;
  padding: 8px 14px;
  border: 1px solid var(--night-edge);
  border-radius: 10px;
  background: #202329;
}
.coupon-legend { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.coupon-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 9px; color: var(--night-muted); font-size: 13px; }
.coupon-legend strong { color: var(--night-text); font-size: 14px; font-variant-numeric: tabular-nums; }
.coupon-swatch { width: 9px; height: 9px; border-radius: 2px; }
.coupon-swatch-view { background: var(--neon-green); box-shadow: 0 0 6px #b7ff5630; }
.coupon-swatch-copy { background: var(--signal-cyan); box-shadow: 0 0 6px #4ce5ff30; }
.coupon-swatch-redeem { background: var(--signal-purple); box-shadow: 0 0 6px rgba(180,92,255,.19); }
.legend { color: var(--night-muted); }
.comparison-meter {
  height: 4px;
  min-width: 42px;
  margin-top: 5px;
  overflow: hidden;
  background: #191c20;
  border: 1px solid #3a4149;
  border-radius: 2px;
}
.comparison-meter > span { display: block; width: var(--bar-width); height: 100%; }
.comparison-meter.impression > span {
  background: linear-gradient(90deg, #568d31, var(--neon-green));
  border-right: 1px solid #dcffb0;
  box-shadow: 0 0 6px #b7ff5638;
}
.comparison-meter.click > span {
  background: linear-gradient(90deg, #246b80, var(--signal-cyan));
  border-right: 1px solid #c1f8ff;
  box-shadow: 0 0 6px #4ce5ff38;
}
.card i[title^="表示"] {
  background-color: var(--neon-green) !important;
  box-shadow: 0 0 8px #b7ff5630;
}
.card i[title^="クリック"] {
  background-color: var(--signal-cyan) !important;
  box-shadow: 0 0 8px #4ce5ff30;
}
@media (max-width: 700px) {
  .side { border-right: 0; border-bottom: 1px solid var(--night-edge); box-shadow: 0 4px 16px #0003; }
  .coupon-chart { grid-template-columns: 1fr; justify-items: center; gap: 8px; padding: 14px; }
  .coupon-legend { width: min(100%, 280px); }
}

/* STEP A-2: subtle neon panel edges */
.card, .modal, .phonewrap {
  border-color: #3a4650;
  box-shadow:
    0 0 0 1px rgba(76, 229, 255, .045),
    0 6px 20px rgba(0, 0, 0, .28),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.grid > .card {
  border-color: #46504e;
  box-shadow:
    0 0 0 1px rgba(183, 255, 86, .035),
    0 6px 18px rgba(0, 0, 0, .3),
    inset 0 1px 0 rgba(255, 255, 255, .025);
}
.previewbox {
  border-color: #3d4951;
  box-shadow: 0 0 10px rgba(76, 229, 255, .035);
}

/* STEP A-3: terminal identity labels */
.pagehead {
  position: relative;
  padding-top: 18px;
}
.pagehead::before {
  position: absolute;
  top: 0;
  left: 0;
  content: "SYSTEM STATUS";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  line-height: 1;
  text-shadow: 0 0 6px rgba(76, 229, 255, .3);
}
.logo small {
  font-size: 0;
  line-height: 1.5;
  letter-spacing: .16em;
}
.logo small::before {
  content: "CONTROL SYSTEM";
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  text-shadow: 0 0 6px rgba(76, 229, 255, .24);
}

/* STEP A-4: terminal status badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #d6ff9d;
  background: #263621;
  border-color: #52703a;
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(183, 255, 86, .08);
  letter-spacing: .04em;
}
.badge::before {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  content: "";
  background: var(--neon-green);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(183, 255, 86, .55);
}
.badge.off {
  color: #a4abb4;
  background: #22262b;
  border-color: #41474f;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}
.badge.off::before {
  background: #727a84;
  box-shadow: none;
}

/* STEP B-1: terminal bar chart */
.card div[style*="min-height:170px"] {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    rgba(166, 186, 198, .09) 31px,
    rgba(166, 186, 198, .09) 32px
  );
  background-size: 100% 32px;
  border-bottom: 1px solid rgba(166, 186, 198, .16);
}
.card i[title^="表示"] {
  background-color: #88e943 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(15, 30, 8, .18) 5px 6px),
    linear-gradient(0deg, #538a2e 0%, #b7ff56 100%) !important;
  border: 1px solid rgba(211, 255, 163, .52);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(183, 255, 86, .2);
}
.card i[title^="クリック"] {
  background-color: #39cce5 !important;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .2) 44%, transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(4, 20, 28, .18) 5px 6px),
    linear-gradient(0deg, #246b80 0%, #4ce5ff 100%) !important;
  border: 1px solid rgba(157, 243, 255, .5);
  border-radius: 2px 2px 0 0 !important;
  box-shadow: 0 0 7px rgba(76, 229, 255, .2);
}

/* STEP D-1A: restrained CRT treatment, dashboard only */
.dashboard-view {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(205, 245, 255, .018) 0,
    rgba(205, 245, 255, .018) 1px,
    transparent 1px,
    transparent 4px
  );
}
.dashboard-view .metric.connection {
  text-shadow: 0 0 2px rgba(183, 255, 86, .68), 0 0 7px rgba(183, 255, 86, .3), 0 0 14px rgba(183, 255, 86, .12);
}
.dashboard-view .metric.click {
  text-shadow: 0 0 2px rgba(76, 229, 255, .68), 0 0 7px rgba(76, 229, 255, .3), 0 0 14px rgba(76, 229, 255, .12);
}
.dashboard-view .metric.ctr {
  text-shadow: 0 0 2px rgba(180,92,255,.62), 0 0 7px rgba(180,92,255,.28), 0 0 14px rgba(180,92,255,.1);
}
.dashboard-view .dashboard-connection-card { --dashboard-accent: rgba(183, 255, 86, .34); }
.dashboard-view .dashboard-click-card { --dashboard-accent: rgba(76, 229, 255, .34); }
.dashboard-view .dashboard-ctr-card { --dashboard-accent: rgba(180,92,255,.3); }
.dashboard-view .dashboard-metric-card {
  border-top-color: var(--dashboard-accent);
  box-shadow: inset 0 1px 0 var(--dashboard-accent), 0 4px 16px #0003, 0 0 12px #4ce5ff08;
}

.logo {
  text-shadow: 0 0 3px rgba(76, 229, 255, .42), 0 0 9px rgba(76, 229, 255, .18);
}
.nav.active {
  background: linear-gradient(90deg, rgba(183, 255, 86, .1), rgba(76, 229, 255, .09) 48%, #252a31);
  box-shadow: inset 2px 0 0 var(--neon-green), inset 0 0 0 1px rgba(76, 229, 255, .16), 0 0 10px rgba(76, 229, 255, .1);
}
/* STEP D-1B: dashboard CRT console treatment */
.dashboard-view {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(205, 245, 255, .026) 0,
    rgba(205, 245, 255, .026) 1px,
    transparent 1px,
    transparent 4px
  );
}
.dashboard-title {
  display: block;
  color: #9fffa6;
  font-family: "Orbitron", "IBM Plex Sans JP", sans-serif;
  font-size: clamp(34px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: .015em;
  line-height: 1.04;
  text-shadow: 0 0 3px rgba(183, 255, 86, .65), 0 0 10px rgba(76, 229, 255, .4), 0 0 22px rgba(76, 229, 255, .18);
}
.dashboard-title-ja {
  display: block;
  margin-top: 5px;
  color: var(--night-muted);
  font-family: "IBM Plex Sans JP", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  line-height: 1.5;
}
.dashboard-system-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: -2px 0 16px;
  padding: 9px 12px;
  background: linear-gradient(90deg, rgba(20, 33, 35, .82), rgba(17, 20, 22, .72));
  border: 1px solid rgba(76, 229, 255, .2);
  border-left: 2px solid rgba(76, 229, 255, .52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.dashboard-console-name { color: #c8f9ff; font-size: 11px; letter-spacing: .07em; }
.dashboard-console-message { margin-top: 3px; color: #98a7a9; font-size: 10px; }
.dashboard-online, .dashboard-connected {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #c7ff94;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  white-space: nowrap;
}
.dashboard-online i, .dashboard-connected i {
  width: 6px;
  height: 6px;
  display: inline-block;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 5px rgba(183, 255, 86, .65), 0 0 10px rgba(183, 255, 86, .25);
}
.dashboard-view .dashboard-metric-card {
  --dashboard-edge: rgba(76, 229, 255, .25);
  position: relative;
  overflow: hidden;
  color: var(--night-text);
  background-color: #15181b;
  background-image:
    repeating-linear-gradient(to bottom, rgba(205, 245, 255, .035) 0 1px, transparent 1px 4px),
    linear-gradient(rgba(76, 229, 255, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(76, 229, 255, .028) 1px, transparent 1px);
  background-size: 100% 4px, 22px 22px, 22px 22px;
  border: 1px solid var(--dashboard-edge);
  border-top-color: rgba(76, 229, 255, .48);
  box-shadow: inset 0 1px 0 rgba(157, 243, 255, .06), 0 5px 16px rgba(0, 0, 0, .36), 0 0 8px rgba(76, 229, 255, .045);
}
.dashboard-view .dashboard-store-card { --dashboard-edge: rgba(183, 255, 86, .2); border-top-color: rgba(183, 255, 86, .42); }
.dashboard-view .dashboard-connection-card { --dashboard-edge: rgba(183, 255, 86, .26); border-top-color: rgba(183, 255, 86, .58); }
.dashboard-view .dashboard-click-card { --dashboard-edge: rgba(76, 229, 255, .28); border-top-color: rgba(76, 229, 255, .58); }
.dashboard-view .dashboard-ctr-card { --dashboard-edge: rgba(180,92,255,.22); border-top-color: rgba(180,92,255,.48); }
.dashboard-view .metric.connection {
  text-shadow: 0 0 2px rgba(183, 255, 86, .78), 0 0 7px rgba(183, 255, 86, .46), 0 0 16px rgba(183, 255, 86, .24), 0 0 25px rgba(183, 255, 86, .1);
}
.dashboard-view .metric.click {
  text-shadow: 0 0 2px rgba(76, 229, 255, .78), 0 0 7px rgba(76, 229, 255, .46), 0 0 16px rgba(76, 229, 255, .24), 0 0 25px rgba(76, 229, 255, .1);
}
.dashboard-view .metric.ctr {
  text-shadow: 0 0 2px rgba(180,92,255,.68), 0 0 7px rgba(180,92,255,.38), 0 0 16px rgba(180,92,255,.18);
}
.dashboard-view .dashboard-delivery-section {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
.dashboard-terminal-label {
  display: block;
  color: var(--signal-cyan);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: .16em;
  line-height: 1.4;
  text-shadow: 0 0 5px rgba(76, 229, 255, .24);
}
.dashboard-view .dashboard-data-table th,
.dashboard-view .dashboard-data-table td { border-bottom-color: rgba(76, 229, 255, .16); }
.dashboard-view .dashboard-data-table th { border-top: 1px solid rgba(76, 229, 255, .18); }
.dashboard-view .dashboard-preview-card {
  border-color: rgba(76, 229, 255, .32);

</style></head><body><div class="app"><aside class="side"><div class="logo">Wi-Fi MEDIA<small>広告・店舗・効果測定</small></div><div class="nav active" onclick="dashboard()">ダッシュボード</div><div class="nav" onclick="ads()">広告管理</div><div class="nav" onclick="stores()">店舗管理</div><div class="nav" onclick="reports()">効果測定</div><div class="nav" onclick="couponManager()">クーポン管理</div><div class="nav" onclick="design()">Webデザイン</div></aside><main class="main" id="main"></main></div><div class="modalbg" id="modal"><div class="modal"><button class="close" onclick="closeModal()">閉じる</button><h2 id="modalTitle">編集</h2><div id="modalBody"></div></div></div><script>let S=null;async function load(){S=await fetch('/api/state').then(r=>r.json());dashboard()}async function save(){await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});await load();toast('保存しました')}function shell(t,s,c){document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>${t}</h1><div class="sub">${s}</div></div></div>${c}`}async function dashboard(){const a=await fetch('/api/analytics').then(r=>r.json());shell('<span class="dashboard-title">Dashboard</span><span class="dashboard-title-ja">ダッシュボード</span>','Wi-Fi接続・広告配信・店舗状況をまとめて確認できます.',`<div class="dashboard-view"><div class="dashboard-system-status"><div><div class="dashboard-console-name">Wi-Fi MEDIA Admin Console</div><div class="dashboard-console-message">Connected. All systems operational.</div></div><span class="dashboard-online"><i></i> ONLINE</span></div><div class="grid"><div class="card dashboard-metric-card dashboard-store-card"><div class="label">登録店舗</div><div class="metric store">${S.stores.length}</div></div><div class="card dashboard-metric-card dashboard-connection-card"><div class="label">今月の接続</div><div class="metric connection">${a.impressions.toLocaleString()}</div></div><div class="card dashboard-metric-card dashboard-click-card"><div class="label">広告クリック</div><div class="metric click">${a.clicks.toLocaleString()}</div></div><div class="card dashboard-metric-card dashboard-ctr-card"><div class="label">CTR</div><div class="metric ctr">${a.ctr}%</div></div></div><div class="layout"><section class="card dashboard-delivery-card"><div class="section dashboard-delivery-section"><span class="dashboard-terminal-label">STORE DELIVERY STATUS</span><span>店舗別 配信状況</span></div><table class="dashboard-data-table"><thead><tr><th>店舗</th><th>広告</th><th>接続</th><th>状態</th><th></th></tr></thead><tbody>${S.stores.map((x,i)=>`<tr><td><b>${x.name}</b><br><small>${x.type}</small></td><td>${S.ad.title}</td><td>${x.users.toLocaleString()}</td><td><span class="badge ${x.status==='停止中'?'off':''}">${x.status}</span></td><td><button class="secondary" onclick="editStore(${i})">編集</button></td></tr>`).join('')}</tbody></table></section><section class="card dashboard-preview-card"><div class="dashboard-preview-head"><div><span class="dashboard-terminal-label">LIVE PREVIEW</span><div class="section">Webページ プレビュー</div></div><span class="dashboard-connected"><i></i> CONNECTED</span></div><div class="phonewrap dashboard-crt-frame"><div class="phone"><iframe src="/?preview=1" title="preview"></iframe></div></div><div class="dashboard-preview-footer"><span>SCANLINE MODE : ON</span><span class="dashboard-signal"><i></i><i></i><i></i></span></div></section></div></div>`)}function ads(){shell('<span class="ad-title">AD MANAGEMENT</span><span class="ad-title-ja">広告管理</span>','広告内容・掲載期間・リンク・画像/GIFを管理します.',`<div class="ad-management-view"><div class="ad-system-status"><div><div class="ad-console-name">AD DELIVERY CONTROL</div><div class="ad-console-message">Editing current advertisement configuration.</div></div><span class="ad-ready"><i></i> READY</span></div><div class="layout ad-layout"><section class="card ad-panel ad-config-panel"><div class="section ad-panel-heading"><span class="ad-terminal-label">AD CONFIGURATION</span><span>現在の広告</span></div><div class="field"><label>店舗</label><select id="aStore">${S.stores.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>タイトル</label><input id="aTitle" value="${esc(S.ad.title)}"></div><div class="field"><label>本文</label><textarea id="aBody">${esc(S.ad.body)}</textarea></div><div class="twocol"><div class="field"><label>掲載開始</label><input id="aStart" type="date" value="${S.ad.start}"></div><div class="field"><label>掲載終了</label><input id="aEnd" type="date" value="${S.ad.end}"></div></div><div class="field"><label>「詳しく見る」のリンク先</label><input id="aLink" type="url" value="${esc(S.ad.link)}" placeholder="https://..."></div><div class="field"><label>画像 / GIF</label><input id="aFile" type="file" accept=".gif,image/gif,image/png,image/jpeg,image/webp"><div class="previewbox ad-upload-note"><strong>MEDIA UPLOAD</strong><span>GIF / JPG / JPEG / PNG / WebP</span><small>GIFを選ぶとサーバーへアップロードし、公開ページのメインビジュアルとして表示できます。</small></div></div><div class="actions ad-actions"><button class="ad-primary" onclick="publishAd()">保存して公開</button><button class="secondary ad-secondary" onclick="window.open('/','_blank')">公開ページを開く</button></div></section><section class="card ad-panel ad-preview-panel"><div class="ad-preview-head"><div><span class="ad-terminal-label">LIVE AD PREVIEW</span><div class="section">広告プレビュー</div></div><span class="ad-connected"><i></i> CONNECTED</span></div><div class="phonewrap ad-crt-frame"><div class="phone ad-crt-phone"><iframe src="/?preview=1" title="preview"></iframe></div></div><div class="ad-preview-footer"><span>PREVIEW MODE : LIVE</span><span class="ad-signal"><i></i><i></i><i></i></span></div></section></div></div>`)}async function publishAd(){const f=document.getElementById('aFile').files[0];let media=S.ad.media;if(f){const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json();if(j.error){alert(j.error);return}media=j.url}S.ad={...S.ad,store:document.getElementById('aStore').value,title:document.getElementById('aTitle').value,body:document.getElementById('aBody').value,start:document.getElementById('aStart').value,end:document.getElementById('aEnd').value,link:document.getElementById('aLink').value,media,published:true};await save()}function couponManager(){S.coupons=S.coupons||[];shell('クーポン管理','クーポンを登録して一覧を確認できます。',`<div class="layout"><section class="card"><div class="section">クーポンを登録</div><div class="field"><label>クーポン名</label><input id="cTitle" placeholder="例：ドリンク1杯無料"></div><div class="field"><label>クーポンコード</label><input id="cCode" placeholder="例：WELCOME10"></div><div class="field"><label>説明</label><textarea id="cDescription" placeholder="特典の内容"></textarea></div><div class="twocol"><div class="field"><label>割引種別</label><select id="cDiscountType"><option value="text">特典内容</option><option value="percent">割引率</option><option value="amount">割引額</option></select></div><div class="field"><label>割引値 / 特典表記</label><input id="cDiscountValue" placeholder="例：10 または ドリンク1杯"></div></div><div class="field"><label>利用店舗</label><select id="cStore"><option value="">指定なし</option>${S.stores.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div><div class="twocol"><div class="field"><label>開始日</label><input id="cStart" type="date"></div><div class="field"><label>終了日</label><input id="cEnd" type="date"></div></div><div class="field"><label>利用条件</label><textarea id="cTerms" placeholder="例：1会計につき1回"></textarea></div><div class="field"><label>状態</label><select id="cStatus"><option value="draft">下書き</option><option value="active">公開中</option></select></div><button onclick="addCoupon()">クーポンを登録</button></section><section class="card"><div class="section">登録済みクーポン</div>${S.coupons.length?`<table><thead><tr><th>クーポン</th><th>コード</th><th>特典内容</th><th>店舗</th><th>期間</th><th>状態</th><th>操作</th></tr></thead><tbody>${S.coupons.map(c=>{const store=S.stores.find(x=>String(x.id)===String(c.storeId))||S.stores.find(x=>x.name===c.store);return `<tr><td><b>${esc(c.title||'クーポン')}</b>${c.description?`<br><small>${esc(c.description)}</small>`:''}</td><td>${esc(c.code||'')}</td><td>${esc(c.discountValue||c.description||'')}</td><td>${esc(store?.name||'指定なし')}</td><td>${esc(c.start||'—')} 〜 ${esc(c.end||'—')}</td><td><span class="badge ${c.status==='active'?'':'off'}">${c.status==='active'?'公開中':'下書き'}</span></td><td>${c.status==='draft'?`<button class="secondary" onclick="deleteCoupon('${esc(c.id)}')">削除</button>`:'公開中のため削除不可'}</td></tr>`}).join('')}</tbody></table>`:'<p class="sub">クーポンはまだ登録されていません。</p>'}</section></div>`)}async function deleteCoupon(id){const coupon=S.coupons.find(c=>String(c.id)===String(id));if(!coupon||coupon.status!=='draft')return;if(!confirm(`下書きクーポン「${coupon.title||'クーポン'}」を削除しますか？\n利用履歴は保持されます。`))return;const r=await fetch(`/api/coupons/${encodeURIComponent(id)}`,{method:'DELETE'});const result=await r.json();if(!r.ok){alert(result.error||'削除できませんでした。');return}S=await fetch('/api/state').then(r=>r.json());couponManager();toast('下書きクーポンを削除しました')}
async function addCoupon(){const title=document.getElementById('cTitle').value.trim(),code=document.getElementById('cCode').value.trim();if(!title||!code){alert('クーポン名とクーポンコードを入力してください。');return}S.coupons=S.coupons||[];const storeId=document.getElementById('cStore').value;S.coupons.push({id:Date.now().toString(),adId:S.ad.id||'main',storeId:storeId||null,title,code,description:document.getElementById('cDescription').value.trim(),discountType:document.getElementById('cDiscountType').value,discountValue:document.getElementById('cDiscountValue').value.trim(),terms:document.getElementById('cTerms').value.trim(),start:document.getElementById('cStart').value,end:document.getElementById('cEnd').value,status:document.getElementById('cStatus').value});await save();couponManager()}function stores(){shell('<span class="store-title">STORE MANAGEMENT</span><span class="store-title-ja">店舗管理</span>','Wi-Fiを設置している店舗・ホテル・拠点を管理します.',`<div class="store-management-view"><div class="store-system-status"><div><div class="store-console-name">STORE NETWORK CONTROL</div><div class="store-console-message">Managing registered Wi-Fi locations.</div></div><span class="store-online"><i></i> ONLINE</span></div><section class="card store-panel"><div class="store-panel-head"><div><span class="store-terminal-label">REGISTERED LOCATIONS</span><div class="store-panel-title">店舗一覧</div></div><div class="actions store-actions" style="justify-content:flex-end;margin-bottom:12px"><button class="store-primary" onclick="addStore()">＋ 店舗を追加</button></div></div><div class="store-table-scroll"><table class="store-data-table"><thead><tr><th>店舗</th><th>業態</th><th>Wi-Fi</th><th>月間接続</th><th>状態</th><th></th></tr></thead><tbody>${S.stores.map((x,i)=>`<tr><td><b>${x.name}</b></td><td>${x.type}</td><td>${x.wifi}</td><td class="store-users">${x.users.toLocaleString()}</td><td><span class="store-state ${x.status==='停止中'?'is-off':'is-online'}"><i></i>${x.status}</span></td><td class="store-row-actions"><button class="secondary store-edit" onclick="editStore(${i})">編集</button> <button class="secondary store-delete" onclick="deleteStore(${i})">削除</button></td></tr>`).join('')}</tbody></table></div></section></div>`)}async function deleteStore(i){if(!confirm(`「${S.stores[i].name}」を削除しますか？`))return;S.stores.splice(i,1);await save();stores()} function editStore(i){const x=S.stores[i];openModal('店舗を編集',`<div class="field"><label>店舗名</label><input id="sName" value="${esc(x.name)}"></div><div class="field"><label>業態</label><input id="sType" value="${esc(x.type)}"></div><div class="field"><label>Wi-Fi</label><input id="sWifi" value="${esc(x.wifi)}"></div><div class="field"><label>月間接続数</label><input id="sUsers" type="number" value="${x.users}"></div><div class="field"><label>状態</label><select id="sStatus"><option ${x.status==='稼働中'?'selected':''}>稼働中</option><option ${x.status==='停止中'?'selected':''}>停止中</option></select></div><button onclick="saveStore(${i})">保存</button>`)}function addStore(){S.stores.push({id:Date.now().toString(),name:'新規店舗',type:'店舗',wifi:'Guest Wi-Fi',users:0,clicks:0,status:'稼働中'});stores();save()}function saveStore(i){const x=S.stores[i];x.name=document.getElementById('sName').value;x.type=document.getElementById('sType').value;x.wifi=document.getElementById('sWifi').value;x.users=+document.getElementById('sUsers').value;x.status=document.getElementById('sStatus').value;closeModal();save()}async function reports(){
  const a=await fetch('/api/analytics').then(r=>r.json());
  const couponAnalytics=await fetch('/api/coupon_analytics').then(r=>r.ok?r.json():Promise.reject(new Error('coupon analytics unavailable'))).catch(()=>({total:0,byType:{},byCoupon:[],unavailable:true}));
  const couponEventCounts={view:Math.max(0,Number(couponAnalytics.byType?.view)||0),copy:Math.max(0,Number(couponAnalytics.byType?.copy)||0),redeem:Math.max(0,Number(couponAnalytics.byType?.redeem)||0)};
  const couponEventTotal=couponEventCounts.view+couponEventCounts.copy+couponEventCounts.redeem;
  const couponViewEnd=couponEventTotal?couponEventCounts.view/couponEventTotal*100:0;
  const couponCopyEnd=couponEventTotal?(couponEventCounts.view+couponEventCounts.copy)/couponEventTotal*100:0;
  const monthly=a.monthly||[];
  const maxMonthly=Math.max(1,...monthly.map(x=>x.impressions||0));

  const storeRows=Object.entries(a.byStore||{});
  const adRows=a.byAd||[];
  const maxValue=(rows,key)=>rows.reduce((max,row)=>Math.max(max,Number(row[key])||0),0);
  const barWidth=(value,max)=>max>0?Math.min(100,Math.max(0,(Number(value)||0)/max*100)):0;
  const storeMaxImpressions=maxValue(storeRows.map(([,x])=>x),'impressions');
  const storeMaxClicks=maxValue(storeRows.map(([,x])=>x),'clicks');
  const adMaxImpressions=maxValue(adRows,'impressions');
  const adMaxClicks=maxValue(adRows,'clicks');

  shell('<span class="analytics-title">ANALYTICS</span><span class="analytics-title-ja">効果測定</span>','PostgreSQLに記録された実測値です。月の区切りは日本時間です.',
  `<div class="analytics-view"><div class="analytics-system-status"><div><div class="analytics-console-name">ANALYTICS MONITOR</div><div class="analytics-console-message">Reading measured delivery and interaction data.</div></div><span class="analytics-live"><i></i> LIVE DATA</span></div><div class="grid analytics-summary">
    <div class="card analytics-metric-impressions"><div class="label">累計表示回数</div><div class="metric impression">${a.impressions.toLocaleString()}</div></div>
    <div class="card analytics-metric-clicks"><div class="label">累計クリック</div><div class="metric click">${a.clicks.toLocaleString()}</div></div>
    <div class="card analytics-metric-ctr"><div class="label">実測CTR</div><div class="metric ctr">${a.ctr}%</div></div>
    <div class="card analytics-metric-records"><div class="label">記録件数</div><div class="metric record">${(a.impressions+a.clicks).toLocaleString()}</div></div>
  </div>

  <section class="card analytics-panel analytics-monthly" style="margin-bottom:18px">
    <div class="analytics-section-heading"><span class="analytics-terminal-label">MONTHLY PERFORMANCE</span><div class="section">月別推移（実測・日本時間）</div></div>
    ${monthly.length?`
      <div style="display:flex;align-items:flex-end;gap:12px;min-height:170px;padding:12px 4px 0;overflow-x:auto">
        ${monthly.map(x=>`
          <div style="min-width:76px;text-align:center;font-size:11px">
            <div style="height:125px;display:flex;align-items:flex-end;justify-content:center;gap:5px">
              <i title="表示 ${x.impressions}" style="display:block;width:22px;height:${Math.max(3,(x.impressions||0)/maxMonthly*115)}px;background:#222;border-radius:4px 4px 0 0"></i>
              <i title="クリック ${x.clicks}" style="display:block;width:22px;height:${Math.max(3,(x.clicks||0)/maxMonthly*115)}px;background:#8a9bb0;border-radius:4px 4px 0 0"></i>
            </div>
            <b>${x.month}</b>
            <div>CTR ${x.ctr}%</div>
          </div>`).join('')}
      </div>
      <div style="font-size:12px;color:#777">■ 表示　■ クリック</div>`
      :'<p style="color:#777">まだ月別の実測データがありません。</p>'}

    <table style="margin-top:16px">
      <thead><tr><th>月（日本時間）</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
      <tbody>
        ${monthly.length?monthly.slice().reverse().map(x=>`
          <tr><td>${x.month}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>
        `).join(''):'<tr><td colspan="4">まだ月別の実測データがありません。</td></tr>'}
      </tbody>
    </table>
  </section>

  <div class="layout analytics-comparisons">
    <section class="card analytics-panel analytics-store-comparison">
      <div class="analytics-section-heading"><span class="analytics-terminal-label">STORE COMPARISON</span><div class="section">店舗別比較（実測）</div></div>
      <table>
        <thead><tr><th>店舗</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
        <tbody>
          ${storeRows.length?storeRows.map(([k,x])=>`
            <tr><td>${k}</td><td><div>${x.impressions.toLocaleString()}</div><div class="comparison-meter impression" aria-hidden="true"><span style="--bar-width:${barWidth(x.impressions,storeMaxImpressions)}%"></span></div></td><td><div>${x.clicks.toLocaleString()}</div><div class="comparison-meter click" aria-hidden="true"><span style="--bar-width:${barWidth(x.clicks,storeMaxClicks)}%"></span></div></td><td>${x.ctr}%</td></tr>
          `).join(''):'<tr><td colspan="4">まだ店舗別データがありません。</td></tr>'}
        </tbody>
      </table>
    </section>

    <section class="card analytics-panel analytics-ad-comparison">
      <div class="analytics-section-heading"><span class="analytics-terminal-label">AD COMPARISON</span><div class="section">広告別比較（実測）</div></div>
      <table>
        <thead><tr><th>広告</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
        <tbody>
          ${adRows.length?adRows.map(x=>`
            <tr><td>${x.name||x.id}</td><td><div>${x.impressions.toLocaleString()}</div><div class="comparison-meter impression" aria-hidden="true"><span style="--bar-width:${barWidth(x.impressions,adMaxImpressions)}%"></span></div></td><td><div>${x.clicks.toLocaleString()}</div><div class="comparison-meter click" aria-hidden="true"><span style="--bar-width:${barWidth(x.clicks,adMaxClicks)}%"></span></div></td><td>${x.ctr}%</td></tr>
          `).join(''):'<tr><td colspan="4">まだ広告別データがありません。</td></tr>'}
        </tbody>
      </table>
    </section>
  </div>

  <section class="card analytics-panel analytics-daily" style="margin-top:18px">
    <div class="analytics-section-heading"><span class="analytics-terminal-label">DAILY LOG</span><div class="section">日別の実測データ</div></div>
    <table>
      <thead><tr><th>日付</th><th>表示</th><th>クリック</th><th>CTR</th></tr></thead>
      <tbody>
        ${a.daily.length?a.daily.slice().reverse().map(x=>`
          <tr><td>${x.date}</td><td>${x.impressions.toLocaleString()}</td><td>${x.clicks.toLocaleString()}</td><td>${x.ctr}%</td></tr>
        `).join(''):'<tr><td colspan="4">まだ実測データがありません。公開ページを開くと表示回数が記録されます。</td></tr>'}
      </tbody>
    </table>
    <p style="font-size:12px;color:#777;line-height:1.7;margin-top:14px">※この試作では、個人を特定する情報は保存せず、「表示」「クリック」「店舗」「広告」「日時」だけを記録しています。</p>
  </section>

  <section class="card analytics-panel analytics-coupons" style="margin-top:18px">
    <div class="analytics-section-heading"><span class="analytics-terminal-label">COUPON ANALYTICS</span><div class="section">クーポン効果測定</div></div>
    ${couponAnalytics.unavailable?'<p style="color:#777">クーポン集計を読み込めませんでした。時間をおいて再度ご確認ください。</p>':`
      <div class="grid">
        <div class="card analytics-coupon-total"><div class="label">クーポン関連イベント</div><div class="metric coupon-total">${(couponAnalytics.total||0).toLocaleString()}</div></div>
        <div class="card analytics-coupon-view"><div class="label">表示</div><div class="metric coupon-view">${(couponAnalytics.byType?.view||0).toLocaleString()}</div></div>
        <div class="card analytics-coupon-copy"><div class="label">店員に見せる</div><div class="metric coupon-copy">${(couponAnalytics.byType?.copy||0).toLocaleString()}</div></div>
        <div class="card analytics-coupon-redeem"><div class="label">利用</div><div class="metric coupon-redeem">${(couponAnalytics.byType?.redeem||0).toLocaleString()}</div></div>
      </div>
      <div class="coupon-chart analytics-coupon-chart">
        <div class="pie${couponEventTotal?'':' is-empty'}" role="img" aria-label="クーポンイベント構成。表示 ${couponEventCounts.view} 件、店員に見せる ${couponEventCounts.copy} 件、利用 ${couponEventCounts.redeem} 件" style="--view-end:${couponViewEnd}%;--copy-end:${couponCopyEnd}%"><span class="pie-total">${couponEventTotal.toLocaleString()}</span></div>
        <ul class="coupon-legend">
          <li><span class="coupon-swatch coupon-swatch-view"></span><span>表示</span><strong>${couponEventCounts.view.toLocaleString()}件</strong></li>
          <li><span class="coupon-swatch coupon-swatch-copy"></span><span>店員に見せる</span><strong>${couponEventCounts.copy.toLocaleString()}件</strong></li>
          <li><span class="coupon-swatch coupon-swatch-redeem"></span><span>利用</span><strong>${couponEventCounts.redeem.toLocaleString()}件</strong></li>
        </ul>
      </div>
      <table>
        <thead><tr><th>クーポンコード</th><th>イベント合計</th><th>表示</th><th>店員に見せる</th><th>利用</th></tr></thead>
        <tbody>
          ${couponAnalytics.byCoupon?.length?couponAnalytics.byCoupon.map(x=>`
            <tr><td>${esc(x.couponCode||'（コードなし）')}</td><td>${(x.total||0).toLocaleString()}</td><td>${(x.byType?.view||0).toLocaleString()}</td><td>${(x.byType?.copy||0).toLocaleString()}</td><td>${(x.byType?.redeem||0).toLocaleString()}</td></tr>
          `).join(''):'<tr><td colspan="5">クーポンの実測データはまだありません。</td></tr>'}
        </tbody>
      </table>
      <p style="font-size:12px;color:#777;line-height:1.7;margin-top:12px">「店員に見せる」はクーポンをスタッフに提示した回数です。「利用」は利用確定時に記録された回数です。</p>
    `}
  </section></div>`);
}
function design(){shell('Webデザイン','公開ページ全体の色・角丸・高さ・見出し・ボタンを変更できます.',`<div class="layout"><section class="card"><div class="section">デザイン設定</div><div class="field"><label>ブランド名</label><input id="dBrand" value="${esc(S.design.brand)}"></div><div class="field"><label>ページ見出し</label><input id="dTitle" value="${esc(S.design.pageTitle)}"></div><div class="twocol"><div class="field"><label>背景色</label><input id="dBg" type="color" value="${S.design.background}"></div><div class="field"><label>文字色</label><input id="dText" type="color" value="${S.design.textColor}"></div></div><div class="twocol"><div class="field"><label>ボタン色</label><input id="dButton" type="color" value="${S.design.buttonColor}"></div><div class="field"><label>ボタン文字色</label><input id="dButtonText" type="color" value="${S.design.buttonTextColor}"></div></div><div class="twocol"><div class="field"><label>角丸</label><input id="dRadius" type="number" value="${S.design.radius}"></div><div class="field"><label>メインビジュアル高さ</label><input id="dHero" type="number" value="${S.design.heroHeight}"></div></div><div class="field"><label>ボタン文言</label><input id="dButtonLabel" value="${esc(S.design.buttonText)}"></div><div class="actions"><button onclick="saveDesign()">デザインを保存</button><button class="secondary" onclick="window.open('/','_blank')">公開ページを見る</button></div></section><section class="card"><div class="section">リアルタイム確認</div><div class="phonewrap"><div class="phone"><iframe src="/?preview=1" title="preview"></iframe></div></div></section></div>`)}async function saveDesign(){S.design={...S.design,brand:document.getElementById('dBrand').value,pageTitle:document.getElementById('dTitle').value,background:document.getElementById('dBg').value,textColor:document.getElementById('dText').value,buttonColor:document.getElementById('dButton').value,buttonTextColor:document.getElementById('dButtonText').value,radius:+document.getElementById('dRadius').value,heroHeight:+document.getElementById('dHero').value,buttonText:document.getElementById('dButtonLabel').value};await save()}function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(m){const e=document.createElement('div');e.textContent=m;e.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:8px;z-index:99';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}load();</script></body></html>
