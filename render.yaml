services:
  - type: web
    name: wifi-media-prototype
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_to_postgres.py && python server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wifi-media-postgres
          property: connectionString

databases:
  - name: wifi-media-postgres
    plan: free
    region: singapore
    databaseName: wifi_media
    user: wifi_media
